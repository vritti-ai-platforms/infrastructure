# pgBackRest configuration for Infisical Secret Manager
# Stanza: infisical
#
# Secrets (R2 keys, cipher passphrases, PG password) are NOT stored here.
# They are injected via environment variables in docker-compose.override.yml:
#
#   PGBACKREST_REPO1_CIPHER_TYPE   aes-256-cbc
#   PGBACKREST_REPO1_CIPHER_PASS   (from BACKREST_REPO1_CIPHER_PASS in .env)
#   PGBACKREST_REPO2_CIPHER_TYPE   aes-256-cbc
#   PGBACKREST_REPO2_CIPHER_PASS   (from BACKREST_REPO2_CIPHER_PASS in .env)
#   PGBACKREST_REPO2_S3_BUCKET     (from BACKREST_R2_BUCKET in .env)
#   PGBACKREST_REPO2_S3_ENDPOINT   (from BACKREST_R2_ENDPOINT in .env)
#   PGBACKREST_REPO2_S3_KEY        (from BACKREST_R2_ACCESS_KEY in .env)
#   PGBACKREST_REPO2_S3_KEY_SECRET (from BACKREST_R2_SECRET_KEY in .env)
#   PGBACKREST_PG1_PASSWORD        (postgres user password)

[global]

# -------------------------------------------------------------------
# REPO1: Local Docker volume (fast restore, 4 weeks of history)
# -------------------------------------------------------------------
repo1-path=/var/lib/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
# cipher settings injected via env vars (PGBACKREST_REPO1_CIPHER_*)

# -------------------------------------------------------------------
# REPO2: Cloudflare R2 (disaster recovery, offsite)
# S3 credentials and bucket injected via env vars (PGBACKREST_REPO2_S3_*)
# -------------------------------------------------------------------
repo2-type=s3
repo2-path=/pgbackrest
repo2-s3-region=auto
repo2-s3-uri-style=path
repo2-retention-full=2
repo2-retention-diff=7
repo2-retention-archive=14
# cipher settings injected via env vars (PGBACKREST_REPO2_CIPHER_*)

# -------------------------------------------------------------------
# Performance and compression
# -------------------------------------------------------------------
compress-type=lz4
compress-level=3
process-max=2
start-fast=y
delta=y

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

# -------------------------------------------------------------------
# Stanza: infisical
# pg1-host connects sidecar → postgres container via Docker internal DNS
# pg1-password injected via PGBACKREST_PG1_PASSWORD env var
# -------------------------------------------------------------------
[infisical]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-host=infisical-postgres
pg1-user=infisical
pg1-database=infisical_db
