# Backend upstream configuration
# Using container name instead of localhost
upstream backend_api {
    # vritti-api is the container name in docker-compose
    server vritti-api:3000 max_fails=3 fail_timeout=30s;

    # Connection pooling
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

# HTTP server - redirect all to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name *.vrittiai.com vrittiai.com;

    # Allow Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.vrittiai.com vrittiai.com;

    # Document root for static files (mounted from host)
    root /usr/share/nginx/html;
    index index.html;

    # SSL configuration (mounted from host)
    # Using wildcard certificate for *.vrittiai.com
    ssl_certificate /etc/nginx/ssl/vrittiai.com.crt;
    ssl_certificate_key /etc/nginx/ssl/vrittiai.com.key;

    # SSL protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # SSL session caching
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/nginx/ssl/vrittiai.com.crt;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Logging
    access_log /var/log/nginx/vritti-access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/vritti-error.log warn;

    # ============================================
    # API Routes - Proxy to Backend Container
    # ============================================

    # Authentication endpoints - stricter rate limiting
    location ~ ^/api/(auth|onboarding)/ {
        limit_req zone=auth_limit burst=30 nodelay;

        # Proxy settings
        proxy_pass http://backend_api;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        # WebSocket support (for SSE)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering off;  # Disable for SSE
        proxy_request_buffering on;

        # URL rewriting - strip /api prefix
        rewrite ^/api/(.*)$ /$1 break;
    }

    # General API routes
    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;

        # Proxy settings
        proxy_pass http://backend_api/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Request-ID $request_id;

        # Connection keepalive
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # ============================================
    # Health & Monitoring Endpoints
    # ============================================

    # Health check - direct to backend root
    location = /health {
        access_log off;
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # CSRF token endpoint
    location /csrf/ {
        proxy_pass http://backend_api/csrf/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger API documentation
    location /api/docs {
        proxy_pass http://backend_api/api/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ============================================
    # Static Files - Optimized Caching
    # ============================================

    # Static assets with content hashing - long cache
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # CORS for Module Federation - allow all vrittiai.com subdomains
        add_header Access-Control-Allow-Origin "https://$host" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle OPTIONS preflight
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://$host";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }

        # Try files, 404 if not found
        try_files $uri =404;
    }

    # Module Federation manifest - short cache for updates
    location = /mf-manifest.json {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header Access-Control-Allow-Origin "https://$host" always;
        add_header Access-Control-Allow-Credentials "true" always;
        default_type application/json;

        try_files $uri =404;
    }

    # Microfrontend manifests - short cache
    location ~ ^/[^/]+/mf-manifest\.json$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header Access-Control-Allow-Origin "https://$host" always;
        add_header Access-Control-Allow-Credentials "true" always;
        default_type application/json;

        try_files $uri =404;
    }

    # Favicon - medium cache
    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # Root assets (robots.txt, manifest.json, etc.)
    location ~* ^/(robots\.txt|manifest\.json|sitemap\.xml)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
        try_files $uri =404;
    }

    # ============================================
    # SPA Fallback - Serve index.html
    # ============================================

    # All other routes - serve index.html (React Router)
    location / {
        # Never cache index.html
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # Try file, then directory, finally fallback to index.html
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # Error Pages
    # ============================================

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
