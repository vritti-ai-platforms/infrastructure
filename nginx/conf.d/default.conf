# Vritti shared edge — routes by Host header to the right app + API.
#
#   cloud.vrittiai.com   /      -> cloud-web    | /api -> cloud-server:3000
#   admin.vrittiai.com   /      -> cloud-web    | /api -> cloud-server:3000
#   *.dev.vrittiai.com   /      -> core-web     | /api -> core-server:3002
#
# Static roots are mounted at /usr/share/nginx/html/{cloud,core}.
# Backends are resolved at request time via Docker's embedded DNS (127.0.0.11),
# which is what lets one server block fan out to two upstreams by Host.

# Host -> API backend (container:port)
map $host $api_backend {
    default                  cloud-server:3000;
    ~^cloud\.vrittiai\.com$  cloud-server:3000;
    ~^admin\.vrittiai\.com$  cloud-server:3000;
    ~\.dev\.vrittiai\.com$   core-server:3002;
}

# Host -> static document root
map $host $static_root {
    default                  /usr/share/nginx/html/cloud;
    ~\.dev\.vrittiai\.com$   /usr/share/nginx/html/core;
}

# ---- HTTP: ACME challenge + redirect to HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name vrittiai.com cloud.vrittiai.com admin.vrittiai.com *.dev.vrittiai.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS: single block, Host-routed ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vrittiai.com cloud.vrittiai.com admin.vrittiai.com *.dev.vrittiai.com;

    # Combined cert: vrittiai.com + *.vrittiai.com + *.dev.vrittiai.com
    ssl_certificate     /etc/nginx/ssl/vrittiai.com.crt;
    ssl_certificate_key /etc/nginx/ssl/vrittiai.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Docker embedded DNS — required for the variable proxy_pass below
    resolver 127.0.0.11 valid=30s ipv6=off;

    root $static_root;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/vritti-access.log;
    error_log  /var/log/nginx/vritti-error.log warn;

    # Media uploads flow through /api to the backend
    client_max_body_size 25m;

    # ---- API: proxy to the Host-selected backend, stripping /api ----
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ---- Hashed static assets — long cache ----
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico {
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # ---- SPA fallback (React Router) ----
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
