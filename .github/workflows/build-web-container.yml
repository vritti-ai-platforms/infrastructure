name: Build Web Container (MF Host)

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Name of the web container app (e.g., vritti-web-nexus)'
        required: true
        type: string
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      build_command:
        description: 'Build command to run'
        required: false
        type: string
        default: 'pnpm build'
      output_dir:
        description: 'Build output directory'
        required: false
        type: string
        default: 'dist'
      production_domain:
        description: 'Production domain URL'
        required: false
        type: string
        default: 'https://cloud.vrittiai.com'
      microfrontend_artifacts:
        description: 'JSON array of MF artifact names to merge (e.g., ["vritti-auth-abc123"])'
        required: false
        type: string
        default: '[]'
    outputs:
      artifact_name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact_name }}
      short_sha:
        description: 'Short commit SHA'
        value: ${{ jobs.build.outputs.short_sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.vars.outputs.artifact_name }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "artifact_name=${{ inputs.app_name }}-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint || true

      - name: Run tests
        run: pnpm test || true

      - name: Build application
        run: ${{ inputs.build_command }}
        env:
          VITE_API_HOST: ${{ inputs.production_domain }}
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "${{ inputs.output_dir }}" ]; then
            echo "❌ Build output directory not found: ${{ inputs.output_dir }}"
            exit 1
          fi

          if [ ! -f "${{ inputs.output_dir }}/index.html" ]; then
            echo "❌ index.html not found in build output"
            exit 1
          fi

          echo "✅ Web container build verified"
          echo "📁 Build output contents:"
          ls -la "${{ inputs.output_dir }}/"

      - name: Download microfrontend artifacts
        if: inputs.microfrontend_artifacts != '[]'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/mf-artifacts

      - name: Merge microfrontend assets
        if: inputs.microfrontend_artifacts != '[]'
        run: |
          echo "🔄 Merging microfrontend assets..."

          # Create static directories if they don't exist
          mkdir -p "${{ inputs.output_dir }}/static"/{css,js,image}

          # Process each downloaded artifact
          for artifact_dir in /tmp/mf-artifacts/*/; do
            if [ -d "$artifact_dir" ]; then
              artifact_name=$(basename "$artifact_dir")
              echo "Processing artifact: $artifact_name"

              # Copy MF manifest if exists
              if [ -f "$artifact_dir/mf-manifest.json" ]; then
                echo "  - Copying mf-manifest.json"
                cp "$artifact_dir/mf-manifest.json" "${{ inputs.output_dir }}/"
              fi

              # Merge static assets
              if [ -d "$artifact_dir/static" ]; then
                echo "  - Merging static assets"
                cp -r "$artifact_dir/static/"* "${{ inputs.output_dir }}/static/" 2>/dev/null || true
              fi
            fi
          done

          # Update manifest URLs for production
          if [ -f "${{ inputs.output_dir }}/mf-manifest.json" ]; then
            echo "🔧 Updating manifest URLs for production..."
            sed -i "s|http://local\.vrittiai\.com:[0-9]*|${{ inputs.production_domain }}|g" "${{ inputs.output_dir }}/mf-manifest.json"
            sed -i "s|https://local\.vrittiai\.com:[0-9]*|${{ inputs.production_domain }}|g" "${{ inputs.output_dir }}/mf-manifest.json"
            echo "📄 Updated manifest:"
            cat "${{ inputs.output_dir }}/mf-manifest.json"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: ${{ inputs.output_dir }}
          retention-days: 7

      - name: Generate build summary
        run: |
          echo "## 🌐 Web Container Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** \`${{ inputs.app_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`${{ steps.vars.outputs.artifact_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Output" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find "${{ inputs.output_dir }}" -type f | head -30 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total size:** $(du -sh "${{ inputs.output_dir }}" | cut -f1)" >> $GITHUB_STEP_SUMMARY
