name: Deploy Infisical

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (default: latest-main)'
        required: false
        type: string
        default: 'latest-main'
  workflow_call:
    inputs:
      image_tag:
        description: 'Image tag to deploy'
        required: false
        type: string
        default: 'latest-main'
    secrets:
      INFISICAL_VM_SSH_KEY:
        required: true
      GHCR_TOKEN:
        required: true
      # Infisical-specific secrets
      INFISICAL_ENCRYPTION_KEY:
        required: true
      INFISICAL_AUTH_SECRET:
        required: true
      # Backup - Cloudflare R2 credentials (prefixed INFISICAL_ to avoid collision with other VM backup secrets)
      INFISICAL_BACKREST_R2_ACCESS_KEY:
        required: false
      INFISICAL_BACKREST_R2_SECRET_KEY:
        required: false
      INFISICAL_BACKREST_REPO1_CIPHER_PASS:
        required: false
      INFISICAL_BACKREST_REPO2_CIPHER_PASS:
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4

      - name: Deploy Infisical to Server VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.INFISICAL_VM_HOST }}
          username: ${{ vars.INFISICAL_VM_USER }}
          key: ${{ secrets.INFISICAL_VM_SSH_KEY }}
          script: |
            set -e

            echo "=========================================="
            echo "[DEPLOY] Deploying Infisical Secret Manager"
            echo "=========================================="

            # Create infisical directory if not exists
            echo "[STEP 1/9] Creating directory..."
            sudo mkdir -p /opt/infisical
            sudo chown $(whoami):$(whoami) /opt/infisical
            cd /opt/infisical
            echo "[OK] Working directory: $(pwd)"

            # Ensure Docker + swap (idempotent base provisioning)
            echo "[STEP 1b] Ensuring Docker and swap..."
            if [ "$(swapon --show=NAME --noheadings | wc -l)" -eq 0 ]; then
              sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$(whoami)" || true
            fi
            sudo systemctl enable --now docker 2>/dev/null || true
            if ! docker info >/dev/null 2>&1; then
              sudo chmod 666 /var/run/docker.sock
            fi
            echo "[OK] Docker: $(docker --version 2>/dev/null || echo missing)"

            # Login to GHCR
            echo "[STEP 2/9] Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "[OK] Docker login successful"

            # Pull the image
            echo "[STEP 3/9] Pulling Docker image..."
            IMAGE="ghcr.io/${{ github.repository_owner }}/infisical-secret-manager:${{ inputs.image_tag }}"
            echo "Image: ${IMAGE}"
            docker pull "${IMAGE}"
            echo "[OK] Image pulled successfully"

            # Download docker-compose files and backup infrastructure from repo
            echo "[STEP 4/9] Downloading compose files and backup scripts..."
            RAW="https://raw.githubusercontent.com/${{ github.repository }}/main"

            # Helper: download a file, fail on non-200
            download_file() {
              local url="$1" dest="$2"
              mkdir -p "$(dirname "${dest}")"
              HTTP_CODE=$(curl -sL -w "%{http_code}" "${url}" -o "${dest}")
              if [ "$HTTP_CODE" != "200" ]; then
                echo "[ERROR] Failed to download ${url} (HTTP ${HTTP_CODE})"
                exit 1
              fi
              echo "[OK] Downloaded $(basename "${dest}") ($(wc -l < "${dest}") lines)"
            }

            # The whole Infisical stack lives under infisical/ in the repo; mirror it flat into
            # /opt/infisical on the server.
            # Full compose (app + redis + postgres/pgBackRest + sidecar; backups baked in)
            download_file "${RAW}/infisical/docker-compose.yml" "docker-compose.yml"

            # pgBackRest config
            download_file "${RAW}/infisical/pgbackrest.conf" "pgbackrest.conf"

            # Backup scripts
            for SCRIPT in backup-full.sh backup-incremental.sh backup-redis.sh restore-postgres.sh restore-redis.sh verify-backup.sh; do
              download_file "${RAW}/infisical/scripts/${SCRIPT}" "scripts/${SCRIPT}"
              chmod +x "scripts/${SCRIPT}"
            done

            # Cron schedule
            download_file "${RAW}/infisical/cron/backup-crontab" "cron/backup-crontab"

            # env.backup.example (for reference; actual .env.backup written below)
            download_file "${RAW}/infisical/.env.backup.example" ".env.backup.example"

            echo "[OK] All compose and backup files downloaded"

            # Show compose file for debugging
            echo "[STEP 5/9] Compose file contents:"
            echo "---"
            cat docker-compose.yml
            echo "---"

            # Create .env file (more reliable than export)
            echo "[STEP 6/9] Creating .env file..."
            echo "GITHUB_ORG=${{ github.repository_owner }}" > .env
            echo "INFISICAL_VERSION=${{ inputs.image_tag }}" >> .env
            echo "INFISICAL_ENCRYPTION_KEY=${{ secrets.INFISICAL_ENCRYPTION_KEY }}" >> .env
            echo "INFISICAL_AUTH_SECRET=${{ secrets.INFISICAL_AUTH_SECRET }}" >> .env
            echo "INFISICAL_SITE_URL=${{ vars.INFISICAL_SITE_URL }}" >> .env
            # Backup - pgBackRest and Cloudflare R2 credentials (used by docker-compose.yml)
            echo "BACKREST_R2_ENDPOINT=${{ vars.INFISICAL_BACKREST_R2_ENDPOINT }}" >> .env
            echo "BACKREST_R2_BUCKET=${{ vars.INFISICAL_BACKREST_R2_BUCKET }}" >> .env
            echo "BACKREST_R2_ACCESS_KEY=${{ secrets.INFISICAL_BACKREST_R2_ACCESS_KEY }}" >> .env
            echo "BACKREST_R2_SECRET_KEY=${{ secrets.INFISICAL_BACKREST_R2_SECRET_KEY }}" >> .env
            echo "BACKREST_REPO1_CIPHER_PASS=${{ secrets.INFISICAL_BACKREST_REPO1_CIPHER_PASS }}" >> .env
            echo "BACKREST_REPO2_CIPHER_PASS=${{ secrets.INFISICAL_BACKREST_REPO2_CIPHER_PASS }}" >> .env
            echo "[OK] .env file created with $(wc -l < .env) variables"

            # Write .env.backup for scripts that source it directly (backup-redis.sh etc.)
            echo "[STEP 6b] Writing .env.backup..."
            {
              echo "BACKREST_R2_ENDPOINT=${{ vars.INFISICAL_BACKREST_R2_ENDPOINT }}"
              echo "BACKREST_R2_BUCKET=${{ vars.INFISICAL_BACKREST_R2_BUCKET }}"
              echo "BACKREST_R2_ACCESS_KEY=${{ secrets.INFISICAL_BACKREST_R2_ACCESS_KEY }}"
              echo "BACKREST_R2_SECRET_KEY=${{ secrets.INFISICAL_BACKREST_R2_SECRET_KEY }}"
              echo "REDIS_BACKUP_LOCAL_DIR=/opt/vritti/backups/infisical/redis"
              echo "REDIS_CONTAINER=infisical-redis"
              echo "BACKUP_MAX_AGE_HOURS=26"
            } > .env.backup
            chmod 600 .env.backup
            echo "[OK] .env.backup written"

            # Verify required environment variables
            echo "[STEP 7/9] Verifying environment variables..."
            source .env
            MISSING_VARS=""
            [ -z "$INFISICAL_ENCRYPTION_KEY" ] && MISSING_VARS="$MISSING_VARS INFISICAL_ENCRYPTION_KEY"
            [ -z "$INFISICAL_AUTH_SECRET" ] && MISSING_VARS="$MISSING_VARS INFISICAL_AUTH_SECRET"
            [ -z "$INFISICAL_SITE_URL" ] && MISSING_VARS="$MISSING_VARS INFISICAL_SITE_URL"
            if [ -n "$MISSING_VARS" ]; then
              echo "[ERROR] Missing required variables:$MISSING_VARS"
              exit 1
            fi
            echo "[OK] All required variables are set"
            echo "  - GITHUB_ORG: ${GITHUB_ORG}"
            echo "  - INFISICAL_VERSION: ${INFISICAL_VERSION}"
            echo "  - INFISICAL_SITE_URL: ${INFISICAL_SITE_URL}"
            echo "  - DB: infisical_db @ infisical-postgres (internal container)"

            # Validate compose configuration
            echo "[STEP 8/9] Validating docker-compose configuration..."
            if ! docker compose config > /dev/null 2>&1; then
              echo "[ERROR] Docker compose config validation failed:"
              docker compose config 2>&1 || true
              exit 1
            fi
            echo "[OK] Compose configuration is valid"

            # Create local backup storage directory (follows /opt/vritti/ pattern)
            echo "[STEP 8b] Creating backup storage directories..."
            sudo mkdir -p /opt/vritti/backups/infisical/redis
            sudo chown -R $(whoami):$(whoami) /opt/vritti/backups/infisical
            echo "[OK] Backup directories ready"

            # Postgres+pgBackRest image is pulled from GHCR by `docker compose up` (no local build).

            # Stop existing containers if running
            echo "[STEP 9/9] Deploying containers..."
            echo "Stopping existing containers (if any)..."
            docker compose down --remove-orphans 2>/dev/null || true

            echo "Starting containers (with backup sidecar)..."
            docker compose up -d

            # Initialize pgBackRest stanza on first deploy (idempotent)
            echo "[BACKUP] Initializing pgBackRest stanza (safe to run multiple times)..."
            sleep 10
            docker exec -u postgres infisical-postgres \
              pgbackrest --stanza=infisical stanza-create 2>&1 || \
              echo "[BACKUP] Stanza already exists or not ready yet — run manually if needed"

            # Install cron schedule (only if not already installed)
            echo "[BACKUP] Installing backup cron schedule..."
            if ! crontab -l 2>/dev/null | grep -q "infisical-backup"; then
              crontab /opt/infisical/cron/backup-crontab
              echo "[OK] Backup cron schedule installed"
            else
              echo "[OK] Backup cron schedule already installed"
            fi

            # Wait for health
            echo ""
            echo "[HEALTH] Waiting for Infisical to be healthy..."
            for i in {1..30}; do
              STATUS=$(docker inspect infisical --format='{{.State.Health.Status}}' 2>/dev/null || echo "not_found")
              echo "  Attempt $i/30: Status = $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "[OK] Infisical is healthy!"
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "[ERROR] Container is unhealthy. Checking logs..."
                docker logs infisical --tail 100
                exit 1
              fi
              if [ $i -eq 30 ]; then
                echo "[WARNING] Health check timeout after 2.5 minutes"
                echo "Container logs:"
                docker logs infisical --tail 100
              fi
              sleep 5
            done

            # Show final status
            echo ""
            echo "[STATUS] Container status:"
            docker compose ps

            echo ""
            echo "[LOGS] Recent Infisical logs:"
            docker logs infisical --tail 30

            # Cleanup old images
            echo ""
            echo "[CLEANUP] Removing unused images..."
            docker image prune -f

            echo ""
            echo "=========================================="
            echo "[OK] Infisical deployment complete!"
            echo "=========================================="

      - name: Health check
        run: |
          echo "[HEALTH] Running external health check..."
          sleep 15

          max_attempts=5
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            if curl -sf "https://${{ vars.INFISICAL_SITE_URL }}/api/status" > /dev/null 2>&1; then
              echo "[OK] Health check passed!"
              exit 0
            fi
            echo "⏳ Retrying in 15s..."
            sleep 15
            attempt=$((attempt + 1))
          done

          echo "[WARNING] External health check could not verify - check manually"

      - name: Generate deployment summary
        run: |
          echo "## 🔐 Infisical Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ github.repository_owner }}/infisical-secret-manager:${{ inputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`${{ vars.INFISICAL_VM_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Site URL:** \`${{ vars.INFISICAL_SITE_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Infisical (port 8080)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Redis (internal, AOF+RDB persistence enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ PostgreSQL 18.4 (internal, WAL archiving enabled)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ pgBackRest sidecar (backup/restore)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backup Schedule (UTC)" >> $GITHUB_STEP_SUMMARY
          echo "- 🗄️ Full backup: Every Sunday 02:00" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Incremental: Mon–Sat 02:00" >> $GITHUB_STEP_SUMMARY
          echo "- 🔴 Redis: Every day 03:00" >> $GITHUB_STEP_SUMMARY
          echo "- ✔️ Verify: Every day 04:00" >> $GITHUB_STEP_SUMMARY
