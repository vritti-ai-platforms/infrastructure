name: Setup Server VM

on:
  workflow_dispatch:
    inputs:
      skip_docker:
        description: 'Skip Docker installation (if already installed)'
        type: boolean
        default: false
      deploy_services:
        description: 'Deploy services after setup (nginx + api)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      skip_docker:
        description: 'Skip Docker installation (if already installed)'
        required: false
        type: boolean
        default: false
      deploy_services:
        description: 'Deploy services after setup (nginx + api)'
        required: false
        type: boolean
        default: true
    secrets:
      SERVER_VM_HOST:
        description: 'VM hostname or IP address'
        required: true
      SERVER_VM_USER:
        description: 'SSH username'
        required: true
      SERVER_VM_SSH_KEY:
        description: 'SSH private key'
        required: true
      PRIMARY_DB_HOST:
        description: 'Database VM private IP'
        required: true
      PRIMARY_DB_PORT:
        description: 'Database port'
        required: false
      PRIMARY_DB_USERNAME:
        description: 'Database username'
        required: true
      PRIMARY_DB_PASSWORD:
        description: 'Database password'
        required: true
      PRIMARY_DB_DATABASE:
        description: 'Database name'
        required: false
      PRIMARY_DB_SCHEMA:
        description: 'Database schema'
        required: false
      JWT_SECRET:
        description: 'JWT signing secret'
        required: true
      COOKIE_SECRET:
        description: 'Cookie signing secret'
        required: true
      CSRF_HMAC_KEY:
        description: 'CSRF HMAC key'
        required: true
      ENCRYPTION_KEY:
        description: 'Encryption key'
        required: true
      WEBAUTHN_RP_ID:
        description: 'WebAuthn RP ID'
        required: true
      WEBAUTHN_ORIGIN:
        description: 'WebAuthn Origin'
        required: true
      BREVO_API_KEY:
        description: 'Email service API key'
        required: true
      GHCR_TOKEN:
        description: 'GitHub Personal Access Token with read:packages scope for GHCR'
        required: true
      LETSENCRYPT_EMAIL:
        description: 'Email address for Let''s Encrypt registration and notifications'
        required: true
      CLOUDFLARE_API_TOKEN:
        description: 'Cloudflare API token for DNS-01 challenge (required for wildcard certificates)'
        required: true

jobs:
  setup:
    name: Setup VM Infrastructure
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://cloud.vrittiai.com

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4

      - name: Validate VM host
        run: |
          echo "Validating VM host: ${{ secrets.SERVER_VM_HOST }}"
          if [[ ! "${{ secrets.SERVER_VM_HOST }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] && [[ ! "${{ secrets.SERVER_VM_HOST }}" =~ ^[a-zA-Z0-9\.-]+$ ]]; then
            echo "ERROR: Invalid VM host format"
            exit 1
          fi
          echo "SUCCESS: VM host format is valid"

      - name: Test SSH connectivity
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            echo "SUCCESS: SSH connection successful"
            echo "System info:"
            echo "  OS: $(lsb_release -d | cut -f2)"
            echo "  Kernel: $(uname -r)"
            echo "  Hostname: $(hostname)"

      - name: Copy setup scripts to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          source: "server-vm/scripts/*"
          target: "/tmp/vm-setup/"
          strip_components: 2

      - name: Install Docker
        if: ${{ !inputs.skip_docker }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            echo "Installing Docker..."
            sudo bash /tmp/vm-setup/install-docker.sh

      - name: Setup deploy user and directories
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            echo "Setting up deploy user..."
            sudo bash /tmp/vm-setup/setup-deploy-user.sh

      - name: Install Let's Encrypt and generate SSL certificates
        uses: appleboy/ssh-action@v1.0.0
        env:
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          envs: LETSENCRYPT_EMAIL,CLOUDFLARE_API_TOKEN
          script: |
            echo "Installing certbot and Cloudflare DNS plugin..."
            sudo apt-get update
            sudo apt-get install -y certbot python3-certbot-dns-cloudflare

            # Create Cloudflare credentials file
            echo "Configuring Cloudflare DNS credentials..."
            sudo mkdir -p /root/.secrets
            sudo bash -c "cat > /root/.secrets/cloudflare.ini <<EOF
            dns_cloudflare_api_token = $CLOUDFLARE_API_TOKEN
            EOF"
            sudo chmod 600 /root/.secrets/cloudflare.ini

            # Generate wildcard SSL certificates using DNS-01 challenge
            echo "Generating Let's Encrypt wildcard certificates for *.vrittiai.com..."
            sudo certbot certonly \
              --dns-cloudflare \
              --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
              --dns-cloudflare-propagation-seconds 60 \
              -d "vrittiai.com" \
              -d "*.vrittiai.com" \
              --email "$LETSENCRYPT_EMAIL" \
              --agree-tos \
              --non-interactive

            # Copy certificates to /opt/vritti/ssl/
            echo "Copying certificates to /opt/vritti/ssl/..."
            sudo cp /etc/letsencrypt/live/vrittiai.com/fullchain.pem /opt/vritti/ssl/vrittiai.com.crt
            sudo cp /etc/letsencrypt/live/vrittiai.com/privkey.pem /opt/vritti/ssl/vrittiai.com.key
            sudo chown ubuntu:ubuntu /opt/vritti/ssl/vrittiai.com.*
            sudo chmod 644 /opt/vritti/ssl/vrittiai.com.crt
            sudo chmod 600 /opt/vritti/ssl/vrittiai.com.key

            echo "SUCCESS: Let's Encrypt SSL certificates generated and installed"
            echo ""
            echo "Certificate info:"
            openssl x509 -in /opt/vritti/ssl/vrittiai.com.crt -noout -subject -dates -issuer

            # Setup automatic certificate renewal
            echo "Setting up automatic certificate renewal..."
            sudo bash -c 'cat > /etc/cron.d/certbot-renew <<EOF
            # Renew Let'\''s Encrypt certificates twice daily at 3am and 3pm
            0 3,15 * * * root certbot renew --quiet --deploy-hook "cp /etc/letsencrypt/live/vrittiai.com/fullchain.pem /opt/vritti/ssl/vrittiai.com.crt && cp /etc/letsencrypt/live/vrittiai.com/privkey.pem /opt/vritti/ssl/vrittiai.com.key && chown ubuntu:ubuntu /opt/vritti/ssl/vrittiai.com.* && chmod 644 /opt/vritti/ssl/vrittiai.com.crt && chmod 600 /opt/vritti/ssl/vrittiai.com.key && docker exec nginx nginx -s reload 2>/dev/null || true"
            EOF'

            echo "SUCCESS: Automatic certificate renewal configured (runs twice daily)"

      - name: Copy docker-compose.yml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          source: "docker/docker-compose.yml"
          target: "/opt/vritti/"
          strip_components: 1

      - name: Create .env file
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_ORG: ${{ github.repository_owner }}
          PRIMARY_DB_HOST: ${{ secrets.PRIMARY_DB_HOST }}
          PRIMARY_DB_PORT: ${{ secrets.PRIMARY_DB_PORT }}
          PRIMARY_DB_USERNAME: ${{ secrets.PRIMARY_DB_USERNAME }}
          PRIMARY_DB_PASSWORD: ${{ secrets.PRIMARY_DB_PASSWORD }}
          PRIMARY_DB_DATABASE: ${{ secrets.PRIMARY_DB_DATABASE }}
          PRIMARY_DB_SCHEMA: ${{ secrets.PRIMARY_DB_SCHEMA }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          CSRF_HMAC_KEY: ${{ secrets.CSRF_HMAC_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          WEBAUTHN_RP_ID: ${{ secrets.WEBAUTHN_RP_ID }}
          WEBAUTHN_ORIGIN: ${{ secrets.WEBAUTHN_ORIGIN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          envs: GITHUB_ORG,PRIMARY_DB_HOST,PRIMARY_DB_PORT,PRIMARY_DB_USERNAME,PRIMARY_DB_PASSWORD,PRIMARY_DB_DATABASE,PRIMARY_DB_SCHEMA,JWT_SECRET,COOKIE_SECRET,CSRF_HMAC_KEY,ENCRYPTION_KEY,WEBAUTHN_RP_ID,WEBAUTHN_ORIGIN,BREVO_API_KEY
          script: |
            echo "Creating .env file..."
            cat > /opt/vritti/.env <<EOF
            # GitHub Configuration
            GITHUB_ORG=${GITHUB_ORG}
            API_VERSION=latest

            # Database Configuration
            PRIMARY_DB_HOST=${PRIMARY_DB_HOST}
            PRIMARY_DB_PORT=${PRIMARY_DB_PORT:-5432}
            PRIMARY_DB_USERNAME=${PRIMARY_DB_USERNAME}
            PRIMARY_DB_PASSWORD=${PRIMARY_DB_PASSWORD}
            PRIMARY_DB_DATABASE=${PRIMARY_DB_DATABASE:-saas_db}
            PRIMARY_DB_SCHEMA=${PRIMARY_DB_SCHEMA:-cloud}
            PRIMARY_DB_SSL_MODE=require

            # Security Secrets
            JWT_SECRET=${JWT_SECRET}
            COOKIE_SECRET=${COOKIE_SECRET}
            CSRF_HMAC_KEY=${CSRF_HMAC_KEY}
            ENCRYPTION_KEY=${ENCRYPTION_KEY}

            # JWT Configuration
            JWT_ACCESS_EXPIRY=15m
            JWT_REFRESH_EXPIRY=30d
            JWT_SIGNUP_EXPIRY=2h
            REFRESH_TOKEN_ROTATION_DAYS=7

            # Cookie Configuration
            REFRESH_COOKIE_NAME=vritti_refresh
            REFRESH_COOKIE_SECURE=true
            REFRESH_COOKIE_DOMAIN=.vrittiai.com

            # WebAuthn Configuration
            WEBAUTHN_RP_NAME=Vritti
            WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}
            WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN}

            # External Services
            BREVO_API_KEY=${BREVO_API_KEY}
            SENDER_EMAIL=noreply@vrittiai.com
            SENDER_NAME=Vritti

            # Logging
            LOG_PROVIDER=winston
            LOG_TO_FILE=true
            LOG_FILE_PATH=/app/logs
            LOG_MAX_FILES=14d
            MASK_PII=true
            EOF

            chmod 600 /opt/vritti/.env
            echo "SUCCESS: .env file created with secure permissions"

      - name: Verify installation
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            echo "Verifying installation..."
            echo ""
            echo "=== Docker Version ==="
            docker --version
            docker compose version
            echo ""
            echo "=== Docker Service Status ==="
            systemctl status docker --no-pager | head -n 3
            echo ""
            echo "=== Deploy User ==="
            id ubuntu
            echo ""
            echo "=== Directory Structure ==="
            ls -la /opt/vritti/
            echo ""
            echo "=== Files ==="
            ls -lh /opt/vritti/docker-compose.yml /opt/vritti/.env 2>/dev/null || echo "Files not found"

      - name: Cleanup temporary files
        if: always()
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            echo "Cleaning up temporary files..."
            rm -rf /tmp/vm-setup/
            echo "SUCCESS: Cleanup complete"

      - name: Generate setup summary
        run: |
          echo "## VM Setup Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VM Host:** \`${{ secrets.SERVER_VM_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Setup Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installed Components" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Engine" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Compose" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy user configured" >> $GITHUB_STEP_SUMMARY
          echo "- Directory structure created" >> $GITHUB_STEP_SUMMARY
          echo "- docker-compose.yml deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Environment variables configured" >> $GITHUB_STEP_SUMMARY
          echo "- mkcert installed and configured" >> $GITHUB_STEP_SUMMARY
          echo "- SSL certificates generated for *.vrittiai.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.deploy_services }}" == "true" ]; then
            echo "Services will be started automatically using docker-compose..." >> $GITHUB_STEP_SUMMARY
          else
            echo "To start services: \`cd /opt/vritti && docker compose up -d\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "To build and deploy individual services:" >> $GITHUB_STEP_SUMMARY
            echo "1. Build/Deploy Nginx: Run \`nginx-build-deploy.yml\` workflow" >> $GITHUB_STEP_SUMMARY
            echo "2. Build/Deploy API: Push to vritti-api-nexus main branch" >> $GITHUB_STEP_SUMMARY
            echo "3. Build/Deploy Web: Push to vritti-web-nexus main branch" >> $GITHUB_STEP_SUMMARY
          fi

  start-services:
    name: Start Services
    needs: setup
    if: ${{ inputs.deploy_services }}
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate with GitHub Container Registry
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ORG: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ORG
          script: |
            echo "Authenticating with GitHub Container Registry..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u $GITHUB_ORG --password-stdin
            echo "SUCCESS: Authenticated with ghcr.io"

      - name: Start Docker services
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            echo "Starting services with docker-compose..."
            cd /opt/vritti
            docker compose pull
            docker compose up -d
            echo ""
            echo "Services started successfully!"
            docker compose ps

  verify:
    name: Verify Deployment
    needs: [setup]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run verification checks
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            echo "Running verification checks..."
            echo ""

            # Check Docker
            if docker --version &>/dev/null; then
              echo "SUCCESS: Docker is installed"
            else
              echo "ERROR: Docker is not installed"
              exit 1
            fi

            # Check Docker service
            if systemctl is-active --quiet docker; then
              echo "SUCCESS: Docker service is running"
            else
              echo "ERROR: Docker service is not running"
              exit 1
            fi

            # Check deploy user
            if id ubuntu &>/dev/null && id -nG ubuntu | grep -qw "docker"; then
              echo "SUCCESS: Deploy user is configured"
            else
              echo "ERROR: Deploy user is not configured properly"
              exit 1
            fi

            # Check directories
            if [ -d /opt/vritti/www ] && [ -d /opt/vritti/ssl ] && [ -d /opt/vritti/logs ]; then
              echo "SUCCESS: Directory structure exists"
            else
              echo "ERROR: Directory structure is incomplete"
              exit 1
            fi

            # Check files
            if [ -f /opt/vritti/docker-compose.yml ] && [ -f /opt/vritti/.env ]; then
              echo "SUCCESS: Required files exist"
            else
              echo "ERROR: Required files are missing"
              exit 1
            fi

            # Check SSL certificates
            if [ -f /opt/vritti/ssl/vrittiai.com.crt ] && [ -f /opt/vritti/ssl/vrittiai.com.key ]; then
              echo "SUCCESS: SSL certificates exist"
              # Verify certificate validity
              if openssl x509 -checkend 0 -noout -in /opt/vritti/ssl/vrittiai.com.crt; then
                echo "SUCCESS: SSL certificate is valid"
                EXPIRY=$(openssl x509 -enddate -noout -in /opt/vritti/ssl/vrittiai.com.crt | cut -d= -f2)
                echo "Certificate expires: $EXPIRY"
              else
                echo "WARNING: SSL certificate has expired"
              fi
            else
              echo "WARNING: SSL certificates not found (manual generation may be required)"
            fi

            # Check mkcert installation
            if command -v mkcert &>/dev/null; then
              echo "SUCCESS: mkcert is installed"
              mkcert -version
            else
              echo "WARNING: mkcert is not installed"
            fi

            echo ""
            echo "SUCCESS: All verification checks passed!"

      - name: Generate verification summary
        run: |
          echo "## Verification Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All system checks passed successfully." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The VM is ready for service deployment." >> $GITHUB_STEP_SUMMARY
