name: Build Backend Image

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Service name (e.g., api-nexus)'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to Dockerfile (default: ./Dockerfile)'
        required: false
        type: string
        default: './Dockerfile'
      build_context:
        description: 'Docker build context path'
        required: false
        type: string
        default: '.'
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      package_json_path:
        description: 'Path to package.json for version (default: ./package.json)'
        required: false
        type: string
        default: './package.json'
      skip_lint_test:
        description: 'Skip lint and test job'
        required: false
        type: boolean
        default: false
      runner:
        description: 'Runner to build on (ubuntu-latest hosted, or self-hosted for a fallback runner)'
        required: false
        type: string
        default: 'ubuntu-latest'
      free_disk_space:
        description: 'Reclaim ~20-25GB of preinstalled tooling before building — only needed for very large images (e.g. infisical); off by default so normal builds stay fast'
        required: false
        type: boolean
        default: false
      build_args:
        description: 'Newline-separated Docker build args (e.g. CMD=application) — passed to build-push-action build-args; empty by default'
        required: false
        type: string
        default: ''
    outputs:
      image_tag:
        description: 'The full image tag that was pushed'
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: 'The image digest'
        value: ${{ jobs.build.outputs.image_digest }}
      short_sha:
        description: 'Short commit SHA'
        value: ${{ jobs.build.outputs.short_sha }}

env:
  REGISTRY: ghcr.io

jobs:
  lint-and-test:
    if: ${{ inputs.skip_lint_test != true }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run tests
        run: pnpm test || true

  build:
    runs-on: ${{ inputs.runner }}
    needs: lint-and-test
    if: ${{ always() && (needs.lint-and-test.result == 'success' || needs.lint-and-test.result == 'skipped') }}
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Large multi-stage images (e.g. infisical-secret-manager ~3.4GB) exhaust the
      # ~14GB ubuntu-latest disk during build + cache export. Reclaim ~20-25GB of
      # preinstalled tooling we don't use before building. Opt-in (free_disk_space) — it
      # adds ~30s and, on a self-hosted runner, would prune that host's images, so it's
      # off unless the caller asks (only infisical needs it).
      - name: Free up disk space
        if: ${{ inputs.free_disk_space }}
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          echo "Disk after cleanup:"; df -h /

      - name: Set variables
        id: vars
        run: |
          BRANCH_NAME=${GITHUB_REF_NAME}

          # Read version from specified package.json path
          VERSION=$(jq -r '.version' "${{ inputs.package_json_path }}")
          VERSION_TAG="${VERSION}-${BRANCH_NAME}"

          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.service_name }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest-${{ steps.vars.outputs.branch }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          build-args: ${{ inputs.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Remove untagged image versions left behind when a tag (e.g. latest-main or the same
      # version-branch) is re-pushed to a new digest. Scoped to this service's package only.
      - name: Delete untagged GHCR images
        if: ${{ github.event_name != 'pull_request' }}
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: ${{ github.repository_owner }}
          packages: ${{ inputs.service_name }}
          delete-untagged: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build summary
        run: |
          echo "## [DOCKER] Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ inputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[WARNING] Image was **not pushed** (PR build)" >> $GITHUB_STEP_SUMMARY
          fi
