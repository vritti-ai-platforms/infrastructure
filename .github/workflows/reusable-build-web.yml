name: Build Web

on:
  workflow_call:
    inputs:
      app_type:
        description: 'Application type: "container" (MF host) or "microfrontend" (MF remote)'
        required: true
        type: string
      app_name:
        description: 'Name of the application (e.g., vritti-web-nexus, vritti-auth)'
        required: true
        type: string
      deploy_path:
        description: 'Deployment path relative to /opt/vritti/www (e.g., "/" for container, "/vritti-auth" for MF)'
        required: true
        type: string
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      build_command:
        description: 'Build command to run'
        required: false
        type: string
        default: 'pnpm build'
      output_dir:
        description: 'Build output directory'
        required: false
        type: string
        default: 'dist'
      production_domain:
        description: 'Production domain URL (for manifest URL updates)'
        required: false
        type: string
        default: 'https://cloud.vrittiai.com'
      microfrontend_artifacts:
        description: 'JSON array of MF artifact names to merge (container only, e.g., ["vritti-auth-abc123"])'
        required: false
        type: string
        default: '[]'
    outputs:
      artifact_name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact_name }}
      short_sha:
        description: 'Short commit SHA'
        value: ${{ jobs.build.outputs.short_sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.vars.outputs.artifact_name }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "artifact_name=${{ inputs.app_name }}-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint || true

      - name: Run tests
        run: pnpm test || true

      - name: Build application
        run: ${{ inputs.build_command }}
        env:
          VITE_API_HOST: ${{ inputs.production_domain }}
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "${{ inputs.output_dir }}" ]; then
            echo "[ERROR] Build output directory not found: ${{ inputs.output_dir }}"
            exit 1
          fi

          # Verify based on app type
          if [ "${{ inputs.app_type }}" = "container" ]; then
            # Container apps MUST have index.html
            if [ ! -f "${{ inputs.output_dir }}/index.html" ]; then
              echo "[ERROR] index.html not found in build output (required for container apps)"
              exit 1
            fi
            echo "[OK] Web container build verified (index.html found)"
          elif [ "${{ inputs.app_type }}" = "microfrontend" ]; then
            # Microfrontends should have mf-manifest.json (informational)
            if [ -f "${{ inputs.output_dir }}/mf-manifest.json" ]; then
              echo "[OK] Module Federation manifest found"
              cat "${{ inputs.output_dir }}/mf-manifest.json"
            else
              echo "[WARNING]  No mf-manifest.json found (optional for microfrontends)"
            fi

            # Check for index.html (some MFs may have it)
            if [ -f "${{ inputs.output_dir }}/index.html" ]; then
              echo "[OK] index.html found"
            fi

            echo "[OK] Microfrontend build verified"
          else
            echo "[ERROR] Invalid app_type: ${{ inputs.app_type }} (must be 'container' or 'microfrontend')"
            exit 1
          fi

          echo "[DIR] Build output contents:"
          ls -la "${{ inputs.output_dir }}/"

      - name: Download microfrontend artifacts
        if: inputs.app_type == 'container' && inputs.microfrontend_artifacts != '[]'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/mf-artifacts

      - name: Merge microfrontend assets
        if: inputs.app_type == 'container' && inputs.microfrontend_artifacts != '[]'
        run: |
          echo " Merging microfrontend assets..."

          # Create static directories if they don't exist
          mkdir -p "${{ inputs.output_dir }}/static"/{css,js,image}

          # Process each downloaded artifact
          for artifact_dir in /tmp/mf-artifacts/*/; do
            if [ -d "$artifact_dir" ]; then
              artifact_name=$(basename "$artifact_dir")
              echo "Processing artifact: $artifact_name"

              # Copy MF manifest if exists
              if [ -f "$artifact_dir/mf-manifest.json" ]; then
                echo "  - Copying mf-manifest.json"
                cp "$artifact_dir/mf-manifest.json" "${{ inputs.output_dir }}/"
              fi

              # Merge static assets
              if [ -d "$artifact_dir/static" ]; then
                echo "  - Merging static assets"
                cp -r "$artifact_dir/static/"* "${{ inputs.output_dir }}/static/" 2>/dev/null || true
              fi
            fi
          done

          # Update manifest URLs for production
          if [ -f "${{ inputs.output_dir }}/mf-manifest.json" ]; then
            echo "[CONFIG] Updating manifest URLs for production..."
            sed -i "s|http://local\.vrittiai\.com:[0-9]*|${{ inputs.production_domain }}|g" "${{ inputs.output_dir }}/mf-manifest.json"
            sed -i "s|https://local\.vrittiai\.com:[0-9]*|${{ inputs.production_domain }}|g" "${{ inputs.output_dir }}/mf-manifest.json"
            echo "[FILE] Updated manifest:"
            cat "${{ inputs.output_dir }}/mf-manifest.json"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: ${{ inputs.output_dir }}
          retention-days: 7

      - name: Generate build summary
        run: |
          # Set emoji based on app type
          if [ "${{ inputs.app_type }}" = "container" ]; then
            EMOJI="[NETWORK]"
            TYPE_LABEL="Web Container (MF Host)"
          else
            EMOJI="[PACKAGE]"
            TYPE_LABEL="Microfrontend (MF Remote)"
          fi

          echo "## $EMOJI $TYPE_LABEL Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** \`${{ inputs.app_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** \`${{ inputs.app_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Path:** \`${{ inputs.deploy_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`${{ steps.vars.outputs.artifact_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Output" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.app_type }}" = "container" ]; then
            find "${{ inputs.output_dir }}" -type f | head -30 >> $GITHUB_STEP_SUMMARY
          else
            ls -lh "${{ inputs.output_dir }}/" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total size:** $(du -sh "${{ inputs.output_dir }}" | cut -f1)" >> $GITHUB_STEP_SUMMARY
