name: Build Web (GHCR tarball)

# Builds a web app's static bundle, packs it into web.tar.gz, and pushes it to
# GHCR as an OCI artifact via oras. NO VM contact — the manual Deploy workflow
# pulls + extracts it later. Symmetric with backend images.

on:
  workflow_call:
    inputs:
      app_name:
        description: 'GHCR artifact name (e.g. cloud-web)'
        required: true
        type: string
      build_command:
        description: 'Build command (e.g. pnpm exec nx build vritti-cloud-web)'
        required: true
        type: string
      output_dir:
        description: 'Build output dir (e.g. apps/cloud-web/dist)'
        required: true
        type: string
      package_json_path:
        description: 'Path to package.json for version (default: ./package.json)'
        required: false
        type: string
        default: './package.json'
      node_version:
        required: false
        type: string
        default: '20'
      production_domain:
        description: 'Public API/site origin (build-time hint)'
        required: false
        type: string
        default: ''
      mf_base_url:
        description: 'Module-federation origin baked into a HOST app as PUBLIC_MF_BASE_URL (e.g. https://mf.dev.vrittiai.com). Leave empty for non-host apps.'
        required: false
        type: string
        default: ''
    outputs:
      image_ref:
        description: 'Full pushed ref (repo:latest-<branch>)'
        value: ${{ jobs.build.outputs.image_ref }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint (blocking)
        run: pnpm lint

      - name: Build
        run: ${{ inputs.build_command }}
        env:
          NODE_ENV: production
          PUBLIC_API_HOST: ${{ inputs.production_domain }}
          PUBLIC_MF_BASE_URL: ${{ inputs.mf_base_url }}

      - name: Pack tarball
        run: |
          test -f "${{ inputs.output_dir }}/index.html" \
            || { echo "::error::index.html missing in ${{ inputs.output_dir }}"; exit 1; }
          tar -czf web.tar.gz -C "${{ inputs.output_dir }}" .
          echo "Bundle size: $(du -h web.tar.gz | cut -f1)"

      - name: Compute tags
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ env.REGISTRY }}/${OWNER}/${{ inputs.app_name }}"
          # Version-based tag (symmetric with backend images): <version>-<branch>
          VERSION=$(jq -r '.version' "${{ inputs.package_json_path }}")
          VERSION_TAG="${VERSION}-${{ github.ref_name }}"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${REPO}:latest-${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: oras-project/setup-oras@v1

      - name: Push tarball to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          REPO="${{ steps.meta.outputs.repo }}"
          VERSION_TAG="${{ steps.meta.outputs.version_tag }}"
          BRANCH="${{ github.ref_name }}"
          # push the <version>-<branch> tag, then add the rolling latest-<branch> tag
          oras push "${REPO}:${VERSION_TAG}" \
            --artifact-type application/vnd.vritti.web.bundle.v1+gzip \
            web.tar.gz:application/gzip
          oras tag "${REPO}:${VERSION_TAG}" "latest-${BRANCH}"
          echo "Pushed ${REPO}:${VERSION_TAG}  (+ latest-${BRANCH})"

      # Remove untagged versions orphaned when latest-<branch> (or a re-pushed sha tag) moves to a new digest.
      - name: Delete untagged GHCR artifacts
        if: ${{ github.event_name != 'pull_request' }}
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        with:
          owner: ${{ github.repository_owner }}
          packages: ${{ inputs.app_name }}
          delete-untagged: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Web bundle published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact:** \`${{ steps.meta.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version tag:** \`${{ steps.meta.outputs.repo }}:${{ steps.meta.outputs.version_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
