name: Build Nginx Image

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: 'Service name (e.g., nginx)'
        required: false
        type: string
        default: 'nginx'
      dockerfile_path:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './nginx/Dockerfile'
      build_context:
        description: 'Docker build context path'
        required: false
        type: string
        default: './nginx'
  workflow_call:
    inputs:
      service_name:
        description: 'Service name (e.g., nginx)'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to Dockerfile (default: ./nginx/Dockerfile)'
        required: false
        type: string
        default: './nginx/Dockerfile'
      build_context:
        description: 'Docker build context path'
        required: false
        type: string
        default: './nginx'
    outputs:
      image_tag:
        description: 'The full image tag that was pushed (multiline)'
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: 'The image digest'
        value: ${{ jobs.build.outputs.image_digest }}
      short_sha:
        description: 'Short commit SHA'
        value: ${{ jobs.build.outputs.short_sha }}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          BRANCH_NAME=${GITHUB_REF_NAME}
          RUN_NUMBER=${{ github.run_number }}

          # Calculate version: 1.0, 1.1, 1.2, etc.
          MAJOR=1
          MINOR=$((RUN_NUMBER - 1))
          VERSION="${MAJOR}.${MINOR}-${BRANCH_NAME}"

          echo "branch=${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.service_name }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest-${{ steps.vars.outputs.branch }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.build_context }}
          file: ${{ inputs.dockerfile_path }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build summary
        run: |
          echo "## [NGINX] Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "[WARNING] Image was **not pushed** (PR build)" >> $GITHUB_STEP_SUMMARY
          fi
