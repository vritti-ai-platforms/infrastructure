name: Build Microfrontend

on:
  workflow_call:
    inputs:
      app_name:
        description: 'Name of the microfrontend app (e.g., vritti-auth)'
        required: true
        type: string
      node_version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      build_command:
        description: 'Build command to run'
        required: false
        type: string
        default: 'pnpm build'
      output_dir:
        description: 'Build output directory'
        required: false
        type: string
        default: 'dist'
      production_domain:
        description: 'Production domain URL'
        required: false
        type: string
        default: 'https://cloud.vrittiai.com'
    outputs:
      artifact_name:
        description: 'Name of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact_name }}
      short_sha:
        description: 'Short commit SHA'
        value: ${{ jobs.build.outputs.short_sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      artifact_name: ${{ steps.vars.outputs.artifact_name }}
      short_sha: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "artifact_name=${{ inputs.app_name }}-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint || true

      - name: Run tests
        run: pnpm test || true

      - name: Build application
        run: ${{ inputs.build_command }}
        env:
          VITE_API_HOST: ${{ inputs.production_domain }}
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "${{ inputs.output_dir }}" ]; then
            echo "❌ Build output directory not found: ${{ inputs.output_dir }}"
            exit 1
          fi

          # Check for MF manifest (for remotes)
          if [ -f "${{ inputs.output_dir }}/mf-manifest.json" ]; then
            echo "✅ Module Federation manifest found"
            cat "${{ inputs.output_dir }}/mf-manifest.json"
          fi

          # Check for index.html (for hosts)
          if [ -f "${{ inputs.output_dir }}/index.html" ]; then
            echo "✅ index.html found"
          fi

          echo "📁 Build output contents:"
          ls -la "${{ inputs.output_dir }}/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.artifact_name }}
          path: ${{ inputs.output_dir }}
          retention-days: 7

      - name: Generate build summary
        run: |
          echo "## 📦 Microfrontend Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**App:** \`${{ inputs.app_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`${{ steps.vars.outputs.artifact_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Output" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh "${{ inputs.output_dir }}/" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
