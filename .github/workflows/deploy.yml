name: Deploy (manual)

# Manually ship a product to the VM. Backend = pull image + docker compose up -d.
# Frontend = oras pull the .tar.gz from GHCR + extract into /opt/vritti/www/<dir>.
# Env/secrets live on the VM in /opt/vritti/{cloud,core}/.env (untouched here).
#
#   vritti-cloud -> cloud-server   + cloud-web (www/cloud)
#   vritti-core  -> core-server, commerce-service + core-web (www/core)

on:
  workflow_dispatch:
    inputs:
      product:
        description: Which application to (re)deploy
        type: choice
        required: true
        options:
          - vritti-cloud
          - vritti-core
      target:
        description: What to ship
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - frontend
      image_tag:
        description: 'Tag to deploy (e.g. latest-main or main-ab12cd3)'
        type: string
        required: true
        default: latest-main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # GeoIP DB lives in this repo (docker/geoip/) — copy it to the VM so cloud-server can mount it.
      # Only needed for cloud backend deploys; core doesn't use GeoIP.
      - name: Checkout (for the GeoIP DB)
        if: inputs.product == 'vritti-cloud' && inputs.target != 'frontend'
        uses: actions/checkout@v4
        with:
          lfs: true   # pull the real GeoLite2 DB, not the LFS pointer

      - name: Copy GeoIP DB to the VM
        if: inputs.product == 'vritti-cloud' && inputs.target != 'frontend'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_VM_HOST }}
          username: ${{ vars.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          source: docker/geoip/GeoLite2-City.mmdb
          target: /opt/vritti/geoip/
          strip_components: 2

      - name: SSH → pull & ship on the VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          PRODUCT: ${{ inputs.product }}
          TARGET: ${{ inputs.target }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ vars.SERVER_VM_HOST }}
          username: ${{ vars.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          envs: PRODUCT,TARGET,IMAGE_TAG,GHCR_TOKEN,GHCR_USER,GHCR_OWNER
          script: |
            set -euo pipefail
            cd /opt/vritti
            OWNER=$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            case "$PRODUCT" in
              vritti-cloud)
                export CLOUD_IMAGE_TAG="$IMAGE_TAG"
                SERVICES="cloud-server"; WEB_REPO="ghcr.io/${OWNER}/cloud-web"; WEB_DIR="cloud" ;;
              vritti-core)
                export CORE_IMAGE_TAG="$IMAGE_TAG"
                SERVICES="core-server commerce-service"; WEB_REPO="ghcr.io/${OWNER}/core-web"; WEB_DIR="core" ;;
            esac

            # ---- Backend ----
            if [ "$TARGET" != "frontend" ]; then
              echo "[backend] $SERVICES @ $IMAGE_TAG"
              docker compose pull $SERVICES
              docker compose up -d --no-deps $SERVICES
              sleep 10
              docker compose ps $SERVICES
            fi

            # ---- Frontend (pull tarball from GHCR, extract into www) ----
            if [ "$TARGET" != "backend" ]; then
              echo "[frontend] ${WEB_REPO}:${IMAGE_TAG} -> /opt/vritti/www/${WEB_DIR}"
              TMP=$(mktemp -d)
              # oras reuses the docker login above for GHCR auth
              oras pull "${WEB_REPO}:${IMAGE_TAG}" -o "$TMP"
              mkdir -p "/opt/vritti/www/${WEB_DIR}"
              find "/opt/vritti/www/${WEB_DIR}" -mindepth 1 -delete
              tar -xzf "$TMP/web.tar.gz" -C "/opt/vritti/www/${WEB_DIR}"
              rm -rf "$TMP"
              docker exec nginx nginx -s reload 2>/dev/null || true
            fi

            docker image prune -f
            echo "Done: $PRODUCT ($TARGET) @ $IMAGE_TAG"

      - name: Summary
        run: |
          echo "## Deploy ${{ inputs.product }} — ${{ inputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${{ inputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Host:** \`${{ vars.SERVER_VM_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
