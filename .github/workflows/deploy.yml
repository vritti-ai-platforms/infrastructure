name: Deploy (manual)

# Manually ship a product to the VM. Backend = pull image + docker compose up -d.
# Frontend = oras pull the .tar.gz from GHCR + extract into /opt/vritti/www/<dir>.
# Env/secrets live on the VM in /opt/vritti/{cloud,core}/.env (untouched here).
#
#   vritti-cloud -> cloud-server   + cloud-web (www/cloud)
#   vritti-core  -> core-server, commerce-service + core-web (www/core)

on:
  workflow_dispatch:
    inputs:
      product:
        description: Which application to (re)deploy
        type: choice
        required: true
        options:
          - vritti-cloud
          - vritti-core
      target:
        description: What to ship
        type: choice
        required: true
        default: all
        options:
          - all
          - backend
          - frontend
      image_tag:
        description: 'Tag to deploy (e.g. latest-main or main-ab12cd3)'
        type: string
        required: true
        default: latest-main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Checkout the infra repo: needed to ship the nginx config (every deploy) and
      # the GeoIP DB (cloud backend deploys). lfs:true pulls the real GeoLite2 DB.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Ship the nginx config on every deploy so repo changes to nginx.conf / conf.d
      # actually reach the VM. The SSH step below validates the config and reloads nginx.
      - name: Ship nginx config to /opt/vritti/nginx
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_VM_HOST }}
          username: ${{ vars.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          source: nginx          # whole dir → /opt/vritti/nginx/
          target: /opt/vritti/

      # GeoIP DB lives in this repo (docker/geoip/) — copy it to the VM so cloud-server can mount it.
      # Only needed for cloud backend deploys; core doesn't use GeoIP.
      - name: Copy GeoIP DB to the VM
        if: inputs.product == 'vritti-cloud' && inputs.target != 'frontend'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_VM_HOST }}
          username: ${{ vars.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          source: docker/geoip/GeoLite2-City.mmdb
          target: /opt/vritti/geoip/
          strip_components: 2

      - name: SSH → pull & ship on the VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          PRODUCT: ${{ inputs.product }}
          TARGET: ${{ inputs.target }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          GHCR_OWNER: ${{ github.repository_owner }}
          CLOUD_ENV: ${{ secrets.CLOUD_ENV }}
          CORE_ENV: ${{ secrets.CORE_ENV }}
          SERVICE_ENV: ${{ secrets.SERVICE_ENV }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        with:
          host: ${{ vars.SERVER_VM_HOST }}
          username: ${{ vars.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          envs: PRODUCT,TARGET,IMAGE_TAG,GHCR_TOKEN,GHCR_USER,GHCR_OWNER,CLOUD_ENV,CORE_ENV,SERVICE_ENV,REDIS_PASSWORD
          script: |
            set -euo pipefail
            cd /opt/vritti
            OWNER=$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # ---- compose-interpolation env: keep REDIS_PASSWORD in /opt/vritti/.env (redis --requirepass) ----
            umask 077
            if [ -n "${REDIS_PASSWORD:-}" ]; then
              touch /opt/vritti/.env && chmod 600 /opt/vritti/.env
              if grep -q '^REDIS_PASSWORD=' /opt/vritti/.env; then
                sed -i "s|^REDIS_PASSWORD=.*|REDIS_PASSWORD=${REDIS_PASSWORD}|" /opt/vritti/.env
              else
                echo "REDIS_PASSWORD=${REDIS_PASSWORD}" >> /opt/vritti/.env
              fi
              echo "REDIS_PASSWORD set in /opt/vritti/.env"
            fi

            case "$PRODUCT" in
              vritti-cloud)
                export CLOUD_IMAGE_TAG="$IMAGE_TAG"
                SERVICES="cloud-server"; WEB_REPO="ghcr.io/${OWNER}/cloud-web"; WEB_DIR="cloud" ;;
              vritti-core)
                export CORE_IMAGE_TAG="$IMAGE_TAG"
                SERVICES="core-server commerce-service"; WEB_REPO="ghcr.io/${OWNER}/core-web"; WEB_DIR="core"
                MF_REMOTES="commerce-mf" ;;
            esac

            # ---- Backend: write .env from secrets, then pull + restart ----
            if [ "$TARGET" != "frontend" ]; then
              umask 077
              # decode a base64 secret to a 0600 file; skip (don't wipe) if the secret is empty
              write_env() {
                if [ -z "$2" ]; then echo "skip $1 (secret empty)"; return 0; fi
                mkdir -p "$(dirname "$1")"
                printf '%s' "$2" | base64 -d > "$1.tmp" && mv "$1.tmp" "$1" && chmod 600 "$1" && echo "wrote $1"
              }
              case "$PRODUCT" in
                vritti-cloud) write_env /opt/vritti/cloud/.env "$CLOUD_ENV" ;;
                vritti-core)  write_env /opt/vritti/core/.env "$CORE_ENV"
                              write_env /opt/vritti/service/.env "$SERVICE_ENV" ;;
              esac

              echo "[backend] $SERVICES @ $IMAGE_TAG"
              docker compose pull $SERVICES
              docker compose up -d --no-deps $SERVICES
              # ensure shared infra is up (idempotent — no-op once running). nginx has no
              # depends_on, so it starts even if the other product isn't deployed yet.
              docker compose up -d nats redis nginx
              sleep 10
              docker compose ps
            fi

            # ---- Frontend (pull tarball from GHCR, extract into www) ----
            if [ "$TARGET" != "backend" ]; then
              echo "[frontend] ${WEB_REPO}:${IMAGE_TAG} -> /opt/vritti/www/${WEB_DIR}"
              TMP=$(mktemp -d)
              # oras reuses the docker login above for GHCR auth
              oras pull "${WEB_REPO}:${IMAGE_TAG}" -o "$TMP"
              mkdir -p "/opt/vritti/www/${WEB_DIR}"
              find "/opt/vritti/www/${WEB_DIR}" -mindepth 1 -delete
              tar -xzf "$TMP/web.tar.gz" -C "/opt/vritti/www/${WEB_DIR}"
              chmod -R a+rX "/opt/vritti/www/${WEB_DIR}"   # umask 077 above makes files 600; nginx (other uid) must read them
              rm -rf "$TMP"

              # Module-federation remotes → served from mf.<domain>/<name>/ (nginx root: www/mf)
              for remote in ${MF_REMOTES:-}; do
                echo "[mf-remote] ghcr.io/${OWNER}/${remote}:${IMAGE_TAG} -> /opt/vritti/www/mf/${remote}"
                RTMP=$(mktemp -d)
                oras pull "ghcr.io/${OWNER}/${remote}:${IMAGE_TAG}" -o "$RTMP"
                mkdir -p "/opt/vritti/www/mf/${remote}"
                find "/opt/vritti/www/mf/${remote}" -mindepth 1 -delete
                tar -xzf "$RTMP/web.tar.gz" -C "/opt/vritti/www/mf/${remote}"
                chmod -R a+rX "/opt/vritti/www/mf/${remote}"
                rm -rf "$RTMP"
              done

              docker exec nginx nginx -s reload 2>/dev/null || true
            fi

            # ---- Apply the nginx config shipped above: validate, then reload ----
            # `nginx -t` fails the deploy on a bad config instead of reloading a broken one.
            if docker exec nginx nginx -t; then
              docker exec nginx nginx -s reload 2>/dev/null || docker compose up -d nginx
              echo "nginx config validated + reloaded"
            else
              echo "ERROR: shipped nginx config failed validation — keeping the running config" >&2
              exit 1
            fi

            docker image prune -f
            echo "Done: $PRODUCT ($TARGET) @ $IMAGE_TAG"

      - name: Summary
        run: |
          echo "## Deploy ${{ inputs.product }} — ${{ inputs.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${{ inputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Host:** \`${{ vars.SERVER_VM_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
