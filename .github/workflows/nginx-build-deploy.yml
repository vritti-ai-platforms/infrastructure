name: Build and Deploy Nginx (Pipeline 5)

on:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment'
        type: boolean
        default: false

jobs:
  build:
    name: Build Nginx Image
    uses: ./.github/workflows/nginx-build.yml
    with:
      image_name: vritti-nginx
      dockerfile_path: ./nginx/Dockerfile
      build_context: ./nginx
    secrets: inherit

  deploy:
    name: Deploy Nginx Container
    needs: build
    uses: ./.github/workflows/nginx-deploy.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
      service_name: nginx-proxy
      compose_file: /opt/vritti/docker-compose.yml
      working_dir: /opt/vritti
      health_check_url: http://localhost/health
    secrets: inherit
