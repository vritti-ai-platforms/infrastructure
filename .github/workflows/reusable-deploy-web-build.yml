name: Deploy Web Build

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the artifact to deploy'
        required: true
        type: string
      deploy_path:
        description: 'Path on server to deploy to'
        required: false
        type: string
        default: '/opt/vritti/www'
      backup_existing:
        description: 'Whether to backup existing files before deploying'
        required: false
        type: boolean
        default: true
      health_check_url:
        description: 'URL to check after deployment (optional)'
        required: false
        type: string
        default: ''
    secrets:
      SERVER_VM_HOST:
        description: 'Server VM hostname or IP'
        required: true
      SERVER_VM_USER:
        description: 'SSH username'
        required: true
      SERVER_VM_SSH_KEY:
        description: 'SSH private key'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ./deploy-files

      - name: Verify artifact contents
        run: |
          echo "[PACKAGE] Artifact contents:"
          ls -la ./deploy-files/

          if [ ! -f "./deploy-files/index.html" ]; then
            echo "[WARNING] Warning: index.html not found in artifact"
          fi

      - name: Create deployment tarball
        run: |
          cd ./deploy-files
          tar -czf ../deploy.tar.gz .
          cd ..
          echo "[PACKAGE] Tarball size: $(du -h deploy.tar.gz | cut -f1)"

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/tmp"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            set -e

            DEPLOY_PATH="${{ inputs.deploy_path }}"
            BACKUP_DIR="/opt/vritti/backups/www"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            echo "[DEPLOY] Deploying static files to $DEPLOY_PATH..."

            # Create directories if they don't exist
            mkdir -p "$DEPLOY_PATH"
            mkdir -p "$BACKUP_DIR"

            # Backup existing files if requested
            if [ "${{ inputs.backup_existing }}" = "true" ] && [ -d "$DEPLOY_PATH" ] && [ "$(ls -A $DEPLOY_PATH 2>/dev/null)" ]; then
              echo "[PACKAGE] Backing up existing files..."
              tar -czf "$BACKUP_DIR/www_$TIMESTAMP.tar.gz" -C "$DEPLOY_PATH" .
              echo "[OK] Backup created: $BACKUP_DIR/www_$TIMESTAMP.tar.gz"

              # Keep only last 5 backups
              ls -t "$BACKUP_DIR"/*.tar.gz 2>/dev/null | tail -n +6 | xargs -r rm -f
            fi

            # Extract new files
            echo " Extracting new files..."
            rm -rf "$DEPLOY_PATH"/*
            tar -xzf /tmp/deploy.tar.gz -C "$DEPLOY_PATH"

            # Set proper permissions
            echo "[SECURITY] Setting permissions..."
            chown -R www-data:www-data "$DEPLOY_PATH" 2>/dev/null || chown -R nginx:nginx "$DEPLOY_PATH" 2>/dev/null || true
            chmod -R 755 "$DEPLOY_PATH"

            # Cleanup
            rm -f /tmp/deploy.tar.gz

            echo "[OK] Deployment complete!"
            echo "[DIR] Deployed files:"
            ls -la "$DEPLOY_PATH/"

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            echo " Reloading Nginx..."
            sudo nginx -t && sudo systemctl reload nginx
            echo "[OK] Nginx reloaded"

      - name: Health check
        if: inputs.health_check_url != ''
        run: |
          echo " Running health check..."
          sleep 5

          if curl -sf "${{ inputs.health_check_url }}" > /dev/null; then
            echo "[OK] Health check passed!"
          else
            echo "[WARNING] Health check failed or endpoint not reachable"
          fi

      - name: Generate deployment summary
        run: |
          echo "## [NETWORK] Static Files Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Artifact:** \`${{ inputs.artifact_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deploy Path:** \`${{ inputs.deploy_path }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`${{ secrets.SERVER_VM_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[OK] Deployment successful" >> $GITHUB_STEP_SUMMARY
