name: Verify VM Setup

on:
  workflow_dispatch:
    inputs:
      vm_host:
        description: 'VM hostname or IP address to verify'
        required: true
        type: string
  workflow_call:
    inputs:
      vm_host:
        description: 'VM hostname or IP address to verify'
        required: true
        type: string

jobs:
  verify:
    name: Verify VM Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run comprehensive verification
        uses: appleboy/ssh-action@v1.0.3
        id: verify
        with:
          host: ${{ inputs.vm_host }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            echo "[CHECK] Comprehensive VM Verification"
            echo "================================="
            echo ""

            ERRORS=0

            # Check 1: Docker Installation
            echo "[PACKAGE] Checking Docker installation..."
            if command -v docker &>/dev/null; then
              DOCKER_VERSION=$(docker --version)
              echo "  [OK] Docker installed: $DOCKER_VERSION"
            else
              echo "  [ERROR] Docker is not installed"
              ERRORS=$((ERRORS + 1))
            fi

            # Check 2: Docker Compose
            echo ""
            echo "[PACKAGE] Checking Docker Compose..."
            if docker compose version &>/dev/null; then
              COMPOSE_VERSION=$(docker compose version)
              echo "  [OK] Docker Compose installed: $COMPOSE_VERSION"
            else
              echo "  [ERROR] Docker Compose is not installed"
              ERRORS=$((ERRORS + 1))
            fi

            # Check 3: Docker Service Status
            echo ""
            echo "[CONFIG] Checking Docker service..."
            if systemctl is-active --quiet docker; then
              echo "  [OK] Docker service is running"
            else
              echo "  [ERROR] Docker service is not running"
              ERRORS=$((ERRORS + 1))
            fi

            # Check 4: Deploy User
            echo ""
            echo "[USER] Checking deploy user..."
            if id ubuntu &>/dev/null; then
              echo "  [OK] User 'ubuntu' exists"
              if id -nG ubuntu | grep -qw "docker"; then
                echo "  [OK] User 'ubuntu' is in docker group"
              else
                echo "  [ERROR] User 'ubuntu' is not in docker group"
                ERRORS=$((ERRORS + 1))
              fi
            else
              echo "  [ERROR] User 'ubuntu' does not exist"
              ERRORS=$((ERRORS + 1))
            fi

            # Check 5: Directory Structure
            echo ""
            echo "[DIR] Checking directory structure..."
            REQUIRED_DIRS=(
              "/opt/vritti"
              "/opt/vritti/www"
              "/opt/vritti/logs"
              "/opt/vritti/logs/nginx"
              "/opt/vritti/logs/api"
              "/opt/vritti/backups"
              "/opt/vritti/backups/www"
              "/opt/vritti/ssl"
            )

            for dir in "${REQUIRED_DIRS[@]}"; do
              if [ -d "$dir" ]; then
                echo "  [OK] $dir exists"
              else
                echo "  [ERROR] $dir does not exist"
                ERRORS=$((ERRORS + 1))
              fi
            done

            # Check 6: Directory Permissions
            echo ""
            echo "[SECURITY] Checking directory permissions..."
            if [ -d /opt/vritti ]; then
              OWNER=$(stat -c '%U:%G' /opt/vritti 2>/dev/null || stat -f '%Su:%Sg' /opt/vritti)
              if [ "$OWNER" = "ubuntu:ubuntu" ]; then
                echo "  [OK] /opt/vritti ownership is correct (ubuntu:ubuntu)"
              else
                echo "  [WARNING]  /opt/vritti ownership is $OWNER (expected ubuntu:ubuntu)"
              fi

              SSL_PERMS=$(stat -c '%a' /opt/vritti/ssl 2>/dev/null || stat -f '%A' /opt/vritti/ssl | tail -c 4)
              if [ "$SSL_PERMS" = "700" ]; then
                echo "  [OK] /opt/vritti/ssl permissions are secure (700)"
              else
                echo "  [WARNING]  /opt/vritti/ssl permissions are $SSL_PERMS (recommended: 700)"
              fi
            fi

            # Check 7: Required Files
            echo ""
            echo "[FILE] Checking required files..."
            if [ -f /opt/vritti/docker-compose.yml ]; then
              echo "  [OK] docker-compose.yml exists"
            else
              echo "  [ERROR] docker-compose.yml does not exist"
              ERRORS=$((ERRORS + 1))
            fi

            if [ -f /opt/vritti/.env ]; then
              echo "  [OK] .env file exists"
              ENV_PERMS=$(stat -c '%a' /opt/vritti/.env 2>/dev/null || stat -f '%A' /opt/vritti/.env | tail -c 4)
              if [ "$ENV_PERMS" = "600" ]; then
                echo "  [OK] .env permissions are secure (600)"
              else
                echo "  [WARNING]  .env permissions are $ENV_PERMS (recommended: 600)"
              fi
            else
              echo "  [ERROR] .env file does not exist"
              ERRORS=$((ERRORS + 1))
            fi

            # Check 8: Docker Containers
            echo ""
            echo "[DOCKER] Checking Docker containers..."
            if docker ps &>/dev/null; then
              NGINX_RUNNING=$(docker ps --filter "name=nginx-proxy" --format "{{.Names}}" 2>/dev/null)
              API_RUNNING=$(docker ps --filter "name=vritti-api" --format "{{.Names}}" 2>/dev/null)

              if [ -n "$NGINX_RUNNING" ]; then
                echo "  [OK] nginx-proxy container is running"
                NGINX_HEALTH=$(docker inspect nginx-proxy --format='{{.State.Health.Status}}' 2>/dev/null)
                if [ "$NGINX_HEALTH" = "healthy" ]; then
                  echo "  [OK] nginx-proxy is healthy"
                else
                  echo "  [WARNING]  nginx-proxy health status: $NGINX_HEALTH"
                fi
              else
                echo "  [WARNING]  nginx-proxy container is not running"
              fi

              if [ -n "$API_RUNNING" ]; then
                echo "  [OK] vritti-api container is running"
                API_HEALTH=$(docker inspect vritti-api --format='{{.State.Health.Status}}' 2>/dev/null)
                if [ "$API_HEALTH" = "healthy" ]; then
                  echo "  [OK] vritti-api is healthy"
                else
                  echo "  [WARNING]  vritti-api health status: $API_HEALTH"
                fi
              else
                echo "  [WARNING]  vritti-api container is not running"
              fi
            else
              echo "  [ERROR] Unable to check Docker containers"
              ERRORS=$((ERRORS + 1))
            fi

            # Check 9: Network Connectivity
            echo ""
            echo "[NETWORK] Checking network connectivity..."
            if curl -f -s -o /dev/null http://localhost/health 2>/dev/null; then
              echo "  [OK] Local health endpoint is accessible"
            else
              echo "  [WARNING]  Local health endpoint is not accessible (services may not be deployed yet)"
            fi

            # Check 10: SSL Certificates
            echo ""
            echo "[SSL] Checking SSL certificates..."
            if [ -f /opt/vritti/ssl/vrittiai.com.crt ] && [ -f /opt/vritti/ssl/vrittiai.com.key ]; then
              echo "  [OK] SSL certificate files exist"

              # Check certificate expiry
              CERT_EXPIRY=$(openssl x509 -in /opt/vritti/ssl/vrittiai.com.crt -noout -enddate 2>/dev/null | cut -d= -f2)
              if [ -n "$CERT_EXPIRY" ]; then
                echo "  [INFO]  Certificate expires: $CERT_EXPIRY"
              fi
            else
              echo "  [WARNING]  SSL certificate files not found (deployment will fail without them)"
            fi

            # Check 11: Disk Space
            echo ""
            echo "[DISK] Checking disk space..."
            DISK_USAGE=$(df -h /opt/vritti | tail -1 | awk '{print $5}' | sed 's/%//')
            echo "  [INFO]  Disk usage: ${DISK_USAGE}%"
            if [ "$DISK_USAGE" -lt 80 ]; then
              echo "  [OK] Sufficient disk space available"
            else
              echo "  [WARNING]  Disk usage is high (${DISK_USAGE}%)"
            fi

            # Summary
            echo ""
            echo "================================="
            echo "[STATS] Verification Summary"
            echo "================================="
            if [ $ERRORS -eq 0 ]; then
              echo "[OK] All critical checks passed!"
              echo ""
              echo "The VM is ready for deployment."
              exit 0
            else
              echo "[ERROR] Found $ERRORS error(s)"
              echo ""
              echo "Please fix the errors before deploying services."
              exit 1
            fi

      - name: Generate verification report
        if: always()
        run: |
          echo "## [CHECK] VM Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VM Host:** \`${{ inputs.vm_host }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Verified at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.verify.outcome }}" == "success" ]; then
            echo "### [OK] Status: PASSED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All verification checks completed successfully." >> $GITHUB_STEP_SUMMARY
            echo "The VM is ready for service deployment." >> $GITHUB_STEP_SUMMARY
          else
            echo "### [ERROR] Status: FAILED" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Some verification checks failed." >> $GITHUB_STEP_SUMMARY
            echo "Please review the logs and fix the issues before deploying services." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checklist" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Engine" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Compose" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Service Running" >> $GITHUB_STEP_SUMMARY
          echo "- Deploy User Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Directory Structure" >> $GITHUB_STEP_SUMMARY
          echo "- File Permissions" >> $GITHUB_STEP_SUMMARY
          echo "- docker-compose.yml" >> $GITHUB_STEP_SUMMARY
          echo "- Environment Variables (.env)" >> $GITHUB_STEP_SUMMARY
          echo "- Docker Containers (if deployed)" >> $GITHUB_STEP_SUMMARY
          echo "- SSL Certificates" >> $GITHUB_STEP_SUMMARY
          echo "- Disk Space" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See workflow logs for detailed results." >> $GITHUB_STEP_SUMMARY
