name: Init VM (one-time provisioning)

# Idempotent VM bootstrap — re-runnable any time. Sets up everything the deploy needs:
#   - 4G swap (required on a ~2 GB box)
#   - Docker + compose plugin (+ adds the SSH user to the docker group)
#   - oras (pulls web bundles from GHCR)
#   - /opt/vritti directory tree (owned by the SSH user)
#   - ships docker-compose.yml + nginx config to the VM
#   - TLS cert via Cloudflare DNS-01 (only if CLOUDFLARE_API_TOKEN is set)
#
# Does NOT touch Postgres — it's already running and you manage it. (You must still
# make Postgres accept the docker bridge: listen_addresses + pg_hba — see DEPLOY.md.)

on:
  workflow_dispatch: {}

jobs:
  init:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true   # so the geoip pointer resolves if we ever ship it here

      - name: Provision (swap, docker, oras, dirs, TLS) — idempotent
        uses: appleboy/ssh-action@v1.0.3
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LE_EMAIL: ${{ vars.LETSENCRYPT_EMAIL }}
        with:
          host: ${{ vars.SERVER_VM_HOST }}
          username: ${{ vars.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          envs: CF_TOKEN,LE_EMAIL
          command_timeout: 20m
          script: |
            set -euo pipefail

            # ---- swap (4G) — only if no swap is active ----
            if [ "$(swapon --show=NAME --noheadings | wc -l)" -eq 0 ]; then
              echo "[swap] creating 4G swapfile"
              [ -f /swapfile ] || sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
              grep -q '^vm.swappiness' /etc/sysctl.conf || echo 'vm.swappiness=10' | sudo tee -a /etc/sysctl.conf
              sudo sysctl -w vm.swappiness=10
            else
              echo "[swap] already active — skip"
            fi

            # ---- Docker + compose plugin ----
            if ! command -v docker >/dev/null 2>&1; then
              echo "[docker] installing via get.docker.com"
              curl -fsSL https://get.docker.com | sudo sh
            else
              echo "[docker] present — skip install"
            fi
            sudo usermod -aG docker "$USER"            # idempotent; applies on next SSH session
            sudo systemctl enable --now docker

            # ---- oras ----
            if ! command -v oras >/dev/null 2>&1; then
              echo "[oras] installing"
              VER=1.2.0
              curl -sL "https://github.com/oras-project/oras/releases/download/v${VER}/oras_${VER}_linux_amd64.tar.gz" \
                | sudo tar -xz -C /usr/local/bin oras
            else
              echo "[oras] present — skip"
            fi

            # ---- /opt/vritti tree (owned by the deploy user) ----
            sudo mkdir -p /opt/vritti/{cloud,core,service,www/cloud,www/core,ssl,nginx/conf.d,logs/{nginx,cloud,core},letsencrypt,geoip}
            sudo chown -R "$USER":"$USER" /opt/vritti
            # app containers run as uid 1001 and write their logs into these bind mounts
            sudo chmod -R 777 /opt/vritti/logs

            # ---- TLS: combined cert via Cloudflare DNS-01 (only with a token + no cert yet) ----
            if [ -n "${CF_TOKEN:-}" ] && [ ! -s /opt/vritti/ssl/vrittiai.com.crt ]; then
              echo "[tls] issuing cert (vrittiai.com + *.vrittiai.com + *.dev.vrittiai.com)"
              sudo apt-get update -qq
              sudo apt-get install -y -qq certbot python3-certbot-dns-cloudflare
              sudo mkdir -p /root/.secrets && sudo chmod 700 /root/.secrets
              printf 'dns_cloudflare_api_token = %s\n' "$CF_TOKEN" | sudo tee /root/.secrets/cloudflare.ini >/dev/null
              sudo chmod 600 /root/.secrets/cloudflare.ini
              sudo certbot certonly --dns-cloudflare \
                --dns-cloudflare-credentials /root/.secrets/cloudflare.ini \
                --dns-cloudflare-propagation-seconds 60 \
                -d vrittiai.com -d '*.vrittiai.com' -d '*.dev.vrittiai.com' \
                --email "${LE_EMAIL:-admin@vrittiai.com}" --agree-tos --non-interactive --keep-until-expiring
              # renewal hook → refresh into /opt/vritti/ssl and reload nginx
              sudo mkdir -p /etc/letsencrypt/renewal-hooks/deploy
              printf '%s\n' \
                '#!/bin/bash' \
                'cp /etc/letsencrypt/live/vrittiai.com/fullchain.pem /opt/vritti/ssl/vrittiai.com.crt' \
                'cp /etc/letsencrypt/live/vrittiai.com/privkey.pem   /opt/vritti/ssl/vrittiai.com.key' \
                'docker exec nginx nginx -s reload 2>/dev/null || true' \
                | sudo tee /etc/letsencrypt/renewal-hooks/deploy/vritti.sh >/dev/null
              sudo chmod +x /etc/letsencrypt/renewal-hooks/deploy/vritti.sh
              sudo cp /etc/letsencrypt/live/vrittiai.com/fullchain.pem /opt/vritti/ssl/vrittiai.com.crt
              sudo cp /etc/letsencrypt/live/vrittiai.com/privkey.pem   /opt/vritti/ssl/vrittiai.com.key
              sudo chown "$USER":"$USER" /opt/vritti/ssl/vrittiai.com.*
            else
              echo "[tls] skipped (no CLOUDFLARE_API_TOKEN, or cert already present)"
            fi

            echo "✅ VM init complete: docker=$(docker --version 2>/dev/null || echo missing), oras=$(oras version 2>/dev/null | head -1), swap=$(swapon --show=SIZE --noheadings | head -1)"

      - name: Ship docker-compose.yml to /opt/vritti
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_VM_HOST }}
          username: ${{ vars.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          source: docker/docker-compose.yml
          target: /opt/vritti/
          strip_components: 1   # docker/docker-compose.yml -> /opt/vritti/docker-compose.yml

      - name: Ship nginx config to /opt/vritti/nginx
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SERVER_VM_HOST }}
          username: ${{ vars.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          source: nginx          # whole dir → /opt/vritti/nginx/ (avoids multi-source parsing)
          target: /opt/vritti/

      - name: Summary
        run: |
          echo "## VM initialized — \`${{ vars.SERVER_VM_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "swap · docker · oras · /opt/vritti · compose + nginx config · TLS (if token set)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Next: ensure Postgres accepts the docker bridge (pg_hba), then run **Deploy**." >> "$GITHUB_STEP_SUMMARY"
