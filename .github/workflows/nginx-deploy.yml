name: Deploy Nginx Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Full image tag to deploy (e.g., ghcr.io/owner/vritti-nginx:abc123)'
        required: true
        type: string
      service_name:
        description: 'Docker compose service name'
        required: false
        type: string
        default: 'nginx-proxy'
      compose_file:
        description: 'Path to docker-compose file on server'
        required: false
        type: string
        default: '/opt/vritti/docker-compose.yml'
      working_dir:
        description: 'Working directory on server'
        required: false
        type: string
        default: '/opt/vritti'
      health_check_url:
        description: 'URL to check after deployment'
        required: false
        type: string
        default: 'http://localhost/health'
  workflow_call:
    inputs:
      image_tag:
        description: 'Full image tag to deploy (multiline from metadata-action)'
        required: true
        type: string
      service_name:
        description: 'Docker compose service name'
        required: false
        type: string
        default: 'nginx-proxy'
      compose_file:
        description: 'Path to docker-compose file on server'
        required: false
        type: string
        default: '/opt/vritti/docker-compose.yml'
      working_dir:
        description: 'Working directory on server'
        required: false
        type: string
        default: '/opt/vritti'
      health_check_url:
        description: 'URL to check after deployment'
        required: false
        type: string
        default: 'http://localhost/health'
    secrets:
      SERVER_VM_HOST:
        description: 'Server VM hostname or IP'
        required: true
      SERVER_VM_USER:
        description: 'SSH username'
        required: true
      SERVER_VM_SSH_KEY:
        description: 'SSH private key'
        required: true
      GHCR_TOKEN:
        description: 'GitHub Container Registry token'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Server VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_VM_HOST }}
          username: ${{ secrets.SERVER_VM_USER }}
          key: ${{ secrets.SERVER_VM_SSH_KEY }}
          script: |
            set -e

            echo "[DEPLOY] Deploying ${{ inputs.service_name }}..."
            cd ${{ inputs.working_dir }}

            # Login to GHCR
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Extract first tag from multiline image_tag output
            IMAGE_TAG=$(echo "${{ inputs.image_tag }}" | head -n 1)
            echo "[PACKAGE] Pulling image: ${IMAGE_TAG}"
            docker pull "${IMAGE_TAG}"

            # Update docker-compose.yml with new image tag
            if [ -f "${{ inputs.compose_file }}" ]; then
              sed -i "s|image: ghcr.io/.*/vritti-nginx:.*|image: ${IMAGE_TAG}|" "${{ inputs.compose_file }}"
              echo "[OK] Updated docker-compose.yml with new image tag"
            else
              echo "[WARNING] docker-compose.yml not found at ${{ inputs.compose_file }}"
            fi

            # Deploy the container
            echo "[DEPLOY] Deploying ${{ inputs.service_name }} container..."
            docker compose -f "${{ inputs.compose_file }}" up -d "${{ inputs.service_name }}"

            # Wait for container to be healthy
            echo "⏳ Waiting for ${{ inputs.service_name }} to be healthy..."
            for i in {1..30}; do
              if docker inspect "${{ inputs.service_name }}" --format='{{.State.Health.Status}}' 2>/dev/null | grep -q "healthy"; then
                echo "[OK] ${{ inputs.service_name }} is healthy"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "[ERROR] ${{ inputs.service_name }} failed to become healthy"
                docker logs "${{ inputs.service_name }}" --tail 50
                exit 1
              fi
              sleep 2
            done

            # Verify container is running
            echo "[CHECK] Verifying deployment..."
            docker compose -f "${{ inputs.compose_file }}" ps "${{ inputs.service_name }}"

            # Show recent logs
            echo "[LOGS] Recent logs:"
            docker compose -f "${{ inputs.compose_file }}" logs --tail=20 "${{ inputs.service_name }}"

            # Cleanup old images (keep last 3)
            echo "[CLEANUP] Cleaning up old images..."
            docker images --filter=reference="ghcr.io/*/vritti-nginx" --format "{{.ID}} {{.Tag}}" | \
              grep -v "latest" | \
              tail -n +4 | \
              awk '{print $1}' | \
              xargs -r docker rmi -f || true

            echo "[OK] Deployment complete!"

      - name: Health check
        if: inputs.health_check_url != ''
        run: |
          echo "[HEALTH] Running health check..."
          sleep 5

          max_attempts=5
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts..."
            if curl -sf "${{ inputs.health_check_url }}" > /dev/null; then
              echo "[OK] Health check passed!"
              exit 0
            fi
            echo "⏳ Health check failed, retrying in 10s..."
            sleep 10
            attempt=$((attempt + 1))
          done

          echo "[ERROR] Health check failed after $max_attempts attempts"
          exit 1

      - name: Generate deployment summary
        run: |
          # Extract first tag for display
          IMAGE_TAG=$(echo "${{ inputs.image_tag }}" | head -n 1)

          echo "## [DEPLOY] Nginx Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ inputs.service_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${IMAGE_TAG}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** \`${{ secrets.SERVER_VM_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.health_check_url }}" != "" ]; then
            echo "**Health Check:** [OK] Passed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification" >> $GITHUB_STEP_SUMMARY
          echo "- [OK] Container deployed and healthy" >> $GITHUB_STEP_SUMMARY
          echo "- [OK] Old images cleaned up" >> $GITHUB_STEP_SUMMARY
