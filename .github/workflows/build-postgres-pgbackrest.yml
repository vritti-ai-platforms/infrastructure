name: Build postgres-pgbackrest

# Builds the custom Postgres+pgBackRest image and pushes it to GHCR, pinned to the exact
# minor (:18.4). No floating major tag — the data dir is version-specific, so every consumer
# pins the same exact minor.

on:
  push:
    branches: [main]
    paths:
      - images/postgres-pgbackrest/Dockerfile
      - .github/workflows/build-postgres-pgbackrest.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: postgres-pgbackrest
  PG_VERSION: "18.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.PG_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: images/postgres-pgbackrest
          file: images/postgres-pgbackrest/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
