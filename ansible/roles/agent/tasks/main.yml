---
# Installs the vritti-application-agent as a container run under systemd. The agent enrolls
# with cloud (using the one-time token, first boot only) and then reconciles the core stack
# on this host from signed desired-state. Ansible does NOT deploy the core compose — the
# agent materializes those containers itself.

- name: Create agent data dir (keys, machine secrets, enrollment cache)
  ansible.builtin.file:
    path: "{{ agent_data_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create core stack root (bind-mount source for pgdata, gitea, logs, backup)
  ansible.builtin.file:
    path: "{{ agent_stack_root }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Pull the agent image
  community.docker.docker_image:
    name: "{{ agent_image }}:{{ agent_image_tag }}"
    source: pull
    force_source: true

- name: Template agent environment file
  ansible.builtin.template:
    src: agent.env.j2
    dest: /etc/vritti-agent/agent.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart vritti-agent

- name: Install systemd unit for the agent
  ansible.builtin.template:
    src: vritti-agent.service.j2
    dest: /etc/systemd/system/vritti-agent.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart vritti-agent

- name: Enable and start the agent
  ansible.builtin.systemd:
    name: vritti-agent
    enabled: true
    state: started
    daemon_reload: true
