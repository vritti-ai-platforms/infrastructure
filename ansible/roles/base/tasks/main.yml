---
# Host baseline: packages, swap, firewall, auto-updates, deploy dirs. Idempotent.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ extra_packages }}"
    state: present

- name: Create swapfile
  ansible.builtin.command:
    cmd: "fallocate -l {{ swap_size_gb }}G /swapfile"
    creates: /swapfile

- name: Secure swapfile permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Check whether /swapfile is already active
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: active_swap
  changed_when: false

- name: Format swapfile
  ansible.builtin.command:
    cmd: mkswap /swapfile
  when: "'/swapfile' not in active_swap.stdout"
  register: mkswap
  changed_when: mkswap.rc == 0
  failed_when: mkswap.rc != 0 and 'already' not in (mkswap.stderr | default(''))

- name: Enable swap now
  ansible.builtin.command:
    cmd: swapon /swapfile
  when: "'/swapfile' not in active_swap.stdout"
  register: swapon
  changed_when: swapon.rc == 0
  failed_when: swapon.rc != 0 and 'already' not in (swapon.stderr | default(''))

- name: Persist swap in fstab
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Tune swappiness low (VM under memory pressure, not thrashing)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    reload: true

- name: Ensure deploy user exists
  ansible.builtin.user:
    name: "{{ deploy_user | default('ubuntu') }}"
    shell: /bin/bash
    groups: sudo
    append: true
  when: (deploy_user | default('ubuntu')) != 'root'

- name: Enable unattended security upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started

- name: Configure UFW default policies
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }

- name: Allow required ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"
    - "2222"   # Gitea SSH (agent add-on)

# acme-dns serves the wildcard DNS-01 challenge on :53 — Let's Encrypt's resolvers reach it here.
# DNS is primarily UDP with a TCP fallback, so both protocols must be open. Only the agent host runs
# acme-dns, so this is gated (the cloud VM has no DNS server — don't open 53 there).
- name: Allow acme-dns (DNS-01 for the agent wildcard cert)
  community.general.ufw:
    rule: allow
    port: "53"
    proto: "{{ item }}"
  loop:
    - tcp
    - udp
  when: allow_acme_dns | default(false) | bool

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Create deploy directory root
  ansible.builtin.file:
    path: /opt/vritti
    state: directory
    owner: "{{ deploy_user | default('ubuntu') }}"
    group: "{{ deploy_user | default('ubuntu') }}"
    mode: "0755"
