---
# Wildcard TLS via certbot + Cloudflare DNS-01. Issues one combined cert for the domains in
# tls_domains and drops it where the cloud nginx expects it (/opt/vritti/ssl).

- name: Install certbot + Cloudflare DNS plugin
  ansible.builtin.apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
    state: present
    update_cache: true

- name: Write Cloudflare credentials
  ansible.builtin.copy:
    dest: /etc/letsencrypt/cloudflare.ini
    owner: root
    group: root
    mode: "0600"
    content: |
      dns_cloudflare_api_token = {{ cloudflare_api_token }}
  no_log: true

- name: Ensure ssl output dir exists
  ansible.builtin.file:
    path: /opt/vritti/ssl
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

# certbot expands the cert when tls_domains grows (e.g. adding api.). No `creates:` guard — that would
# skip the run once the cert exists and silently freeze the SAN list. --keep-until-expiring makes it a
# no-op when the domain set is unchanged and the cert isn't near expiry, so this stays idempotent; the
# `changed_when` detects the keep case so the redeploy handler only fires on an actual (re)issue.
- name: Request/expand wildcard certificate (DNS-01)
  ansible.builtin.command:
    cmd: >-
      certbot certonly --non-interactive --agree-tos
      --dns-cloudflare --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini
      --dns-cloudflare-propagation-seconds 30
      -m {{ tls_email }}
      {% for d in tls_domains %}-d '{{ d }}' {% endfor %}
      --cert-name vrittiai --expand --keep-until-expiring
  register: certbot_result
  changed_when: "'not yet due for renewal' not in certbot_result.stdout"
  notify: Deploy TLS certs to nginx

- name: Deploy hook — copy renewed certs into the nginx ssl dir (also runs on certbot auto-renewal)
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/vritti-nginx.sh
    mode: "0755"
    content: |
      #!/bin/bash
      set -e
      cp /etc/letsencrypt/live/vrittiai/fullchain.pem /opt/vritti/ssl/vrittiai.com.crt
      cp /etc/letsencrypt/live/vrittiai/privkey.pem   /opt/vritti/ssl/vrittiai.com.key
      docker exec nginx nginx -s reload 2>/dev/null || true
