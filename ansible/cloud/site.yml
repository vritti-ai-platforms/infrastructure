# cloud — cloud control plane. Ansible owns the host + the cloud compose stack (nginx + cloud-web
# SPA + cloud-server + postgres/redis/nats + DbLab + TLS + Cloudflare tunnel). Core deployments
# (dev + prod vritti-core) are owned by the Go agent and are NOT provisioned here.
- name: Provision cloud control plane
  hosts: cloud
  become: true
  roles:
    - role: base
      tags: [base, control-plane]
    - role: docker
      tags: [docker, control-plane]
    - role: zfs
      when: enable_zfs | default(false)
      tags: [zfs, control-plane]
    - role: tls
      when: enable_tls | default(false)
      tags: [tls, control-plane]
    # geoip BEFORE cloud_stack — the .mmdb must exist before cloud-server bind-mounts it.
    - role: geoip
      when: enable_cloud_stack | default(false)
      tags: [geoip, control-plane]
    - role: cloud_stack
      when: enable_cloud_stack | default(false)
      tags: [cloud_stack, control-plane]
    # cloudflared last — the cloud app network it attaches to exists by now.
    - role: cloudflared
      tags: [cloudflared, control-plane]
