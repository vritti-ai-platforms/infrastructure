# The `core` play (site.yml) runs standalone from this folder — its own .infisical.json pins the
# vritti-core project (default env apw1; override with --env). It bootstraps a target VM (base+docker+
# GHCR) AND deploys the agent, all from that project's /agent secrets. Roles are shared with cloud/
# (../roles); the inventory is a single placeholder host whose IP + secrets come entirely from --env,
# so this play needs NO tofu/R2 creds. group_vars/core.yml here is picked up playbook-adjacent.
[defaults]
inventory = inventory.yml
roles_path = ../roles
host_key_checking = False
retry_files_enabled = False
timeout = 30
result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
