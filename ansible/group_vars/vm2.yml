# VM2 = the PROD vritti-core deployment, agent-managed. No cloud stack, no ZFS.
# Ansible only lands Docker + the agent here; the agent materializes the whole core stack
# (postgres, redis, nats, core-server, commerce-service, its own nginx edge) from desired-state.
vm_role: core

base_domain: "apw1.vrittiai.com"

deployment_id: "{{ lookup('env', 'VM2_DEPLOYMENT_ID') }}"
enroll_token: "{{ lookup('env', 'VM2_ENROLL_TOKEN') }}"

enable_zfs: false
enable_dblab: false
enable_cloud_stack: false
enable_tls: false

# No cloudflared on vm2: prod core is public (agent's own nginx + Let's Encrypt on *.apw1),
# git goes over SSH (:2222), and core-server manages Gitea via the API. Nothing internal needs
# a browser-gated surface here, so there is no tunnel.
