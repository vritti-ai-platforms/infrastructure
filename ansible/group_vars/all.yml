# Shared across both VMs.
ansible_python_interpreter: /usr/bin/python3

# SSH connection (host IPs come from the tofu dynamic inventory, not here).
ansible_user: ubuntu
ansible_ssh_private_key_file: "~/.ssh/vritti_vm"

# GHCR pull auth for private images (cloud-server + the cloud-web bundle). From Infisical (via infisical run).
ghcr_username: "{{ lookup('env', 'ANSI_GHCR_USERNAME') | default('shashank-vritti', true) }}"
ghcr_token: "{{ lookup('env', 'ANSI_GHCR_TOKEN') }}"

# Host baseline.
swap_size_gb: 4
extra_packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - ufw
  - unattended-upgrades

# Docker.
docker_apt_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"
