# Agent play vars (roles/agent). Runs under vritti-core / apw1 / path /agent, where the deploy/enroll
# secrets live. Host bootstrap (base/docker/GHCR login) is done separately by ../../vm2.yml (infra env).
vm_role: core
base_domain: "apw1.vrittiai.com"

deployment_id: "{{ lookup('env', 'VM2_DEPLOYMENT_ID') }}"
enroll_token: "{{ lookup('env', 'VM2_ENROLL_TOKEN') }}"
# cloud_url has a sane default in roles/agent/defaults/main.yml; override here only if needed.

# Connection (host IP is the reserved vm2 IP in ./inventory.yml).
ansible_python_interpreter: /usr/bin/python3
ansible_user: ubuntu
ansible_ssh_private_key_file: "~/.ssh/id_rsa"
