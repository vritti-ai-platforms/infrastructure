# The agent play runs standalone from this folder — its own .infisical.json pins the vritti-core
# project / apw1 (deploy/enroll secrets at path /agent). Roles are shared with vm1/vm2 (../roles);
# the inventory is a static local file with vm2's RESERVED IP, so this play needs NO tofu/R2 creds
# (the vritti-core env has none). group_vars/vm2.yml here is picked up playbook-adjacent.
[defaults]
inventory = inventory.yml
roles_path = ../roles
host_key_checking = False
retry_files_enabled = False
timeout = 30
result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
