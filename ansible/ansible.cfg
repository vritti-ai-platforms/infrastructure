[defaults]
inventory = inventory/tofu-inventory.py
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Grace for a freshly-booted VM whose first sudo/SSH can be slow (avoids the become-prompt timeout).
timeout = 30
# YAML-formatted task output via the built-in default callback (the old community.general.yaml
# stdout callback was removed in community.general 12.0).
result_format = yaml
interpreter_python = auto_silent
# No ansible-vault: all secrets come from Infisical, injected as env vars via `infisical run`.

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
