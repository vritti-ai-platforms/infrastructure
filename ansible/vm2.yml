# VM2 — prod-core HOST bootstrap ONLY: base packages + docker + GHCR login. Runs under the
# infrastructure Infisical env (prod), same as vm1 (needs ANSI_GHCR_TOKEN for the login).
# The agent is deployed SEPARATELY by ../agent/agent.yml under the vritti-core apw1 /agent env.
# The GHCR login this play performs persists in the host's docker config, so the agent play can
# pull the private application-agent image without GHCR creds in the vritti-core env.
- name: Provision VM2 host (prod core)
  hosts: vm2
  become: true
  roles:
    - role: base
    - role: docker
