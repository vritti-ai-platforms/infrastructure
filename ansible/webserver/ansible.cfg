# The `webserver` play (site.yml) runs standalone from this folder — its own .infisical.json pins the
# `webservers` project (one env per server: ws1, ws2, …). It bootstraps a web-server VM (base + docker +
# GHCR) AND deploys the ws-agent. Roles are shared with core/cloud (../roles); the inventory is a single
# placeholder host whose hostname comes from `-e target_host={env}.vrittiai.com` (the `just ansi-webserver`
# recipe derives it from the selected --env name). group_vars/webserver.yml is picked up playbook-adjacent.
# Deploy secrets (GHCR_*, WEB_SERVER_ID, ENROLL_TOKEN) come from each env's /agent/ansible path.
[defaults]
inventory = inventory.yml
roles_path = ../roles
host_key_checking = False
retry_files_enabled = False
timeout = 30
result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
