version: '3.8'

services:
  vritti-api:
    image: ghcr.io/${GITHUB_ORG:-yourorg}/vritti-api-nexus:${API_VERSION:-latest}
    container_name: vritti-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Runtime settings
      - NODE_ENV=production
      - PORT=3000
      # Database Configuration
      - PRIMARY_DB_HOST=${PRIMARY_DB_HOST}
      - PRIMARY_DB_PORT=${PRIMARY_DB_PORT:-5432}
      - PRIMARY_DB_USERNAME=${PRIMARY_DB_USERNAME}
      - PRIMARY_DB_PASSWORD=${PRIMARY_DB_PASSWORD}
      - PRIMARY_DB_DATABASE=${PRIMARY_DB_DATABASE:-saas_db}
      - PRIMARY_DB_SCHEMA=${PRIMARY_DB_SCHEMA:-cloud}
      - PRIMARY_DB_SSL_MODE=${PRIMARY_DB_SSL_MODE:-require}
      # Security Secrets
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_HMAC_KEY=${CSRF_HMAC_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # JWT Configuration
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-30d}
      - JWT_SIGNUP_EXPIRY=${JWT_SIGNUP_EXPIRY:-2h}
      - REFRESH_TOKEN_ROTATION_DAYS=${REFRESH_TOKEN_ROTATION_DAYS:-7}
      # Cookie Configuration
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME:-vritti_refresh}
      - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE:-true}
      - REFRESH_COOKIE_DOMAIN=${REFRESH_COOKIE_DOMAIN}
      # WebAuthn/Passkey Configuration
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Vritti}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN}
      # External Services - Email
      - BREVO_API_KEY=${BREVO_API_KEY}
      - SENDER_EMAIL=${SENDER_EMAIL:-noreply@vrittiai.com}
      - SENDER_NAME=${SENDER_NAME:-Vritti}
      # External Services - SMS
      - SMS_PROVIDER_API_KEY=${SMS_PROVIDER_API_KEY}
      # Logging
      - LOG_PROVIDER=${LOG_PROVIDER:-winston}
      - LOG_TO_FILE=${LOG_TO_FILE:-true}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-14d}
      - MASK_PII=${MASK_PII:-true}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vritti-network

  # Auth microservice (if separate from api-nexus)
  # vritti-auth-service:
