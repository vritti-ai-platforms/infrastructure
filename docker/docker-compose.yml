# Vritti shared stack — single VM, both products behind one nginx.
# Postgres runs NATIVELY on the host; containers reach it via host.docker.internal.
#
# Layout on the VM (compose runs from /opt/vritti):
#   /opt/vritti/docker-compose.yml
#   /opt/vritti/.env            <- compose interpolation (image tags, REDIS_PASSWORD) — MANUAL
#   /opt/vritti/cloud/.env      <- cloud-server      env  (written by Deploy from CLOUD_ENV)
#   /opt/vritti/core/.env       <- core-server       env  (written by Deploy from CORE_ENV)
#   /opt/vritti/service/.env    <- commerce-service  env  (written by Deploy from SERVICE_ENV)
#   /opt/vritti/www/{cloud,core}  <- static frontends (served by nginx)
#   /opt/vritti/geoip/GeoLite2-City.mmdb  <- shipped by Deploy (Git LFS)
#   /opt/vritti/ssl, /opt/vritti/logs, /opt/vritti/letsencrypt
#
# Memory note: with native Postgres (~400M) + this stack on a 2 GB VM you are at
# the ceiling — a swapfile is REQUIRED (see DEPLOY.md). 4 GB recommended.

name: vritti

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./www:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
      - ./letsencrypt:/var/www/letsencrypt:ro
    depends_on:
      cloud-server:
        condition: service_healthy
      core-server:
        condition: service_healthy
    networks: [vritti]
    mem_limit: 96m
    logging: *logging

  cloud-server:
    image: ghcr.io/vritti-ai-platforms/cloud-server:${CLOUD_IMAGE_TAG:-latest-main}
    container_name: cloud-server
    restart: unless-stopped
    env_file: [./cloud/.env]
    environment:
      - NODE_ENV=production
      - PORT=3000
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach native Postgres on the host
    expose: ["3000"]
    volumes:
      - ./logs/cloud:/app/logs
      # GeoIP DB — shipped to /opt/vritti/geoip by the Deploy workflow (committed in infra docker/geoip/)
      - ./geoip/GeoLite2-City.mmdb:/app/data/GeoLite2-City.mmdb:ro
    networks: [vritti]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *logging

  core-server:
    image: ghcr.io/vritti-ai-platforms/core-server:${CORE_IMAGE_TAG:-latest-main}
    container_name: core-server
    restart: unless-stopped
    env_file: [./core/.env]
    environment:
      - NODE_ENV=production
      - PORT=3002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose: ["3002"]
    volumes:
      - ./logs/core:/app/logs
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_started
    networks: [vritti]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging: *logging

  commerce-service:
    image: ghcr.io/vritti-ai-platforms/commerce-service:${CORE_IMAGE_TAG:-latest-main}
    container_name: commerce-service
    restart: unless-stopped
    env_file: [./service/.env]
    environment:
      - NODE_ENV=production
      - APP_NAME=commerce-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      nats:
        condition: service_started
    networks: [vritti]
    mem_limit: 256m
    logging: *logging

  nats:
    image: nats:2.10-alpine
    container_name: nats
    restart: unless-stopped
    expose: ["4222"]          # internal only — never published to the host
    networks: [vritti]
    mem_limit: 96m
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in /opt/vritti/.env}
    expose: ["6379"]          # internal only
    networks: [vritti]
    mem_limit: 160m
    logging: *logging

networks:
  vritti:
    name: vritti-network
    driver: bridge
