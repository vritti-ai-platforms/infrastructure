# Local Development Docker Compose Configuration (macOS)
# Used by: Local development on Mac (Apple Silicon M1/M2/M3 or Intel)
# Platform: Uses native architecture (arm64 for Apple Silicon, amd64 for Intel Mac)
# Usage: docker compose -f docker-compose-mac.yml up -d

services:
  # Nginx Reverse Proxy & Static File Server
  nginx:
    image: ghcr.io/${GITHUB_ORG:-yourorg}/nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Static files (read-only)
      - ./www:/usr/share/nginx/html:ro
      # SSL certificates (read-only)
      - ./ssl:/etc/nginx/ssl:ro
      # Logs (read-write)
      - ./logs/nginx:/var/log/nginx
      # Let's Encrypt challenge directory
      - ./letsencrypt:/var/www/letsencrypt:ro
    depends_on:
      api-nexus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vritti-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:443/api/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # API Service
  api-nexus:
    image: ghcr.io/${GITHUB_ORG:-yourorg}/api-nexus:${API_VERSION:-latest}
    platform: linux/amd64
    container_name: api-nexus
    restart: unless-stopped
    # NO PORT EXPOSURE - only accessible via internal Docker network
    expose:
      - "3000"
    environment:
      # Runtime settings
      - NODE_ENV=development
      - PORT=3000
      # Database Configuration
      - PRIMARY_DB_HOST=${PRIMARY_DB_HOST}
      - PRIMARY_DB_PORT=${PRIMARY_DB_PORT:-5432}
      - PRIMARY_DB_USERNAME=${PRIMARY_DB_USERNAME}
      - PRIMARY_DB_PASSWORD=${PRIMARY_DB_PASSWORD}
      - PRIMARY_DB_DATABASE=${PRIMARY_DB_DATABASE:-saas_db}
      - PRIMARY_DB_SCHEMA=${PRIMARY_DB_SCHEMA:-cloud}
      - PRIMARY_DB_MIGRATION_SCHEMA=${PRIMARY_DB_MIGRATION_SCHEMA:-cloud_drizzle}
      - PRIMARY_DB_SSL_MODE=${PRIMARY_DB_SSL_MODE:-require}
      # Security Secrets
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - CSRF_HMAC_KEY=${CSRF_HMAC_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # JWT Configuration
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY:-15m}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY:-30d}
      - JWT_SIGNUP_EXPIRY=${JWT_SIGNUP_EXPIRY:-2h}
      - REFRESH_TOKEN_ROTATION_DAYS=${REFRESH_TOKEN_ROTATION_DAYS:-7}
      # Cookie Configuration
      - REFRESH_COOKIE_NAME=${REFRESH_COOKIE_NAME:-vritti_refresh}
      - REFRESH_COOKIE_SECURE=${REFRESH_COOKIE_SECURE:-true}
      - REFRESH_COOKIE_DOMAIN=${REFRESH_COOKIE_DOMAIN}
      # WebAuthn/Passkey Configuration
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-Vritti}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN}
      # External Services - Email
      - BREVO_API_KEY=${BREVO_API_KEY}
      - SENDER_EMAIL=${SENDER_EMAIL:-noreply@vrittiai.com}
      - SENDER_NAME=${SENDER_NAME:-Vritti}
      # External Services - SMS
      - SMS_PROVIDER_API_KEY=${SMS_PROVIDER_API_KEY}
      # Logging
      - LOG_PROVIDER=${LOG_PROVIDER:-winston}
      - LOG_TO_FILE=${LOG_TO_FILE:-true}
      - LOG_FILE_PATH=${LOG_FILE_PATH:-/app/logs}
      - LOG_MAX_FILES=${LOG_MAX_FILES:-14d}
      - MASK_PII=${MASK_PII:-true}
      # OAuth Configuration
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET}
      - MICROSOFT_CALLBACK_URL=${MICROSOFT_CALLBACK_URL}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET}
      - FACEBOOK_CALLBACK_URL=${FACEBOOK_CALLBACK_URL}
      - X_CLIENT_ID=${X_CLIENT_ID}
      - X_CLIENT_SECRET=${X_CLIENT_SECRET}
      - X_CALLBACK_URL=${X_CALLBACK_URL}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - APPLE_KEY_ID=${APPLE_KEY_ID}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY}
      - APPLE_CALLBACK_URL=${APPLE_CALLBACK_URL}
      # WhatsApp Configuration
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_API_VERSION=${WHATSAPP_API_VERSION}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN}
      # Bcrypt Configuration
      - BCRYPT_SALT_ROUNDS=${BCRYPT_SALT_ROUNDS:-10}
      # Frontend Configuration
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - vritti-network

